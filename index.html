/* ===== Navigation: تنها منبع استایل ناوبری =====
   ناوبری اصلی: ۵ بخش (برای مدیر ۶). دسکتاپ: گولی‌های افقی؛ موبایل: نوار پایین.
   زیرزبانه‌ها (.subnav): نمای‌های هم‌خانوادهٔ هر بخش، بالای محتوا. */
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding-block:8px 16px}
.nav button{flex:none;position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 16px;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.nav button:hover{border-color:var(--primary)}
.nav button[aria-current="page"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 3px 10px color-mix(in srgb,var(--primary) 18%,transparent)}
.nav button .ni{display:inline-flex;font-size:1.05rem;line-height:1}
.ico{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.btn .ico{margin-inline-end:6px}
.subnav{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.subnav button{flex:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;border-radius:0;padding:8px 14px;color:var(--muted);font-weight:600}
.subnav button:hover{color:var(--ink)}
.subnav button[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
@media(max-width:700px){
  .nav{position:fixed;inset-inline:0;bottom:0;z-index:40;flex-wrap:nowrap;justify-content:space-around;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px max(6px,env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .nav>button{flex:1 1 0;min-width:0;min-height:52px;flex-direction:column;justify-content:center;gap:2px;padding:6px 2px;border:0;background:transparent;border-radius:12px;font-size:.74rem}
  .nav>button .ni{font-size:1.35rem}
  .nav>button[aria-current="page"]{background:var(--surface2);color:var(--primary);font-weight:700;box-shadow:none}
  .nav .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px)}
}

/* ===== لایهٔ نهایی یکپارچگی بصری و تجربهٔ کاربری ===== */
:root{
  --radius:14px;
  --elev-1:0 2px 8px rgba(18,48,40,.045);
  --elev-2:0 10px 26px rgba(18,48,40,.085);
  --ring:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent);
}
html{scroll-behavior:smooth;scroll-padding-top:18px}
body{
  background:
    radial-gradient(ellipse at 92% 0%,color-mix(in srgb,var(--primary) 5%,transparent),transparent 34rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:color-mix(in srgb,var(--primary) 22%,transparent);color:var(--ink)}
button{ -webkit-tap-highlight-color:transparent }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--accent);outline-offset:3px
}
.card,.kpi,.stats-panel,.stats-kpi,.home-metrics article,.home-shortcut,.admin-group,.life-intro{
  box-shadow:var(--elev-1);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background-color .18s ease;
}
.card{border-radius:16px}
.card:hover,.stats-panel:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--line))}
.btn{
  min-height:40px;border-radius:11px;font-weight:700;
  box-shadow:0 2px 5px color-mix(in srgb,var(--primary) 12%,transparent);
  transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,background-color .16s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 18%,transparent);filter:saturate(1.08)}
.btn:active:not(:disabled){transform:translateY(0) scale(.985);box-shadow:none}
.btn.ghost{box-shadow:none}
input[type=text],input[type=password],input[type=search],input[type=number],select,textarea{
  border-radius:11px;transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:var(--ring);outline:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.72}
label.f>span,div.f>span{font-weight:600}
.tile,.bcard,.chip,.story,.fact,.note,.life-stat{transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease}
.tile:focus-visible,.home-shortcut:focus-visible{outline-offset:4px}
.sheet{box-shadow:0 18px 60px rgba(0,0,0,.2)}
.toast{box-shadow:0 8px 28px rgba(0,0,0,.22);backdrop-filter:blur(12px)}
.results button:focus-visible,.results button:hover{background:var(--surface2)}
.top{padding-top:14px;padding-bottom:10px}
.brand-t{letter-spacing:-.025em}
.brand-s{line-height:1.5}
.home-hero,.stats-welcome{box-shadow:var(--elev-2)}
.home-hero{border:1px solid #ffffff1c}
.home-shortcut:active{transform:scale(.985)}
.home-shortcut>span{filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}
.stats-panel{border-radius:18px}
.stats-kpi{border-radius:16px}
.stats-kpi.primary{background:linear-gradient(145deg,color-mix(in srgb,var(--primary) 10%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--primary) 28%,var(--line))}
.stats-birthdays .bday.today{background:color-mix(in srgb,var(--accent) 13%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.admin-group>summary{transition:background-color .16s ease}
.admin-group>summary:hover{background:var(--surface2)}
.modal{backdrop-filter:blur(5px)}
.modal .sheet{animation:sheet-in .2s ease-out}
@keyframes sheet-in{from{opacity:.6;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#view{animation:view-in .2s ease-out}
@keyframes view-in{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
:root[data-theme="dark"] .stats-kpi.primary{background:linear-gradient(145deg,color-mix(in srgb,var(--primary) 17%,var(--surface)),var(--surface))}
:root[data-theme="dark"] .home-pending{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 38%,var(--line))}
:root[data-theme="dark"] .home-pending b,:root[data-theme="dark"] .home-pending small{color:var(--ink)}
:root[data-theme="dark"] .stats-birthdays .bday.today{background:color-mix(in srgb,var(--accent) 15%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.art-box,.chart-box,.outline{box-shadow:var(--elev-1)}
.art-box{border-radius:16px}
@media(min-width:701px){
  .top{padding-top:18px}
  .stack{gap:18px}
}
@media(max-width:700px){
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .top{gap:8px;padding-top:12px}
  .brand{gap:8px}
  .brand-t{font-size:1.28rem}
  .brand-s{font-size:.75rem}
  .who{gap:7px;font-size:.82rem}
  .card{padding:15px}
  .sheet{border-radius:20px 20px 0 0;padding-top:25px}
  .sheet:before{content:"";width:38px;height:4px;border-radius:99px;background:var(--line);position:absolute;top:9px;left:calc(50% - 19px)}
  .home-hero,.stats-welcome{border-radius:20px}
}
@media(max-width:380px){
  .brand-t{font-size:1.12rem}
  .who{font-size:.76rem}
  .who .link{font-size:.78rem}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  #view,.modal .sheet{animation:none!important}
  *,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* کلید مقایسهٔ عمومی (شهر، شغل، نام): فاصله، نیم‌فاصله، ی/ک عربی، اعراب و نشانه‌ها نادیده گرفته می‌شود */
const vKey=s=>nn(s).replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[ئىي]/g,'ی').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,'');
const tidy=s=>String(s==null?'':s).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200e\u200f]/g,'').replace(/\s+/g,' ').trim();
function lev1(a,b){ if(a===b) return true; const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false; let i=0; while(i<la&&i<lb&&a[i]===b[i]) i++;
  if(la===lb) return a.slice(i+1)===b.slice(i+1)||(a[i]===b[i+1]&&a[i+1]===b[i]&&a.slice(i+2)===b.slice(i+2));
  return la>lb?a.slice(i+1)===b.slice(i):b.slice(i+1)===a.slice(i); }
const kl=t=>String(t||'').split(/\n|،|,/).map(x=>x.trim()).filter(Boolean);
const nameLike=(line,p)=>{ const a=vKey(line), b=vKey(full(p)), c=vKey(p.first); return !!a&&(a===b||a===c||(a.length>=4&&(lev1(a,b)||lev1(a,c)))); };
/* یکپارچه‌سازی مقدارهای دستی (شهر و شغل) */
const POOLS={place:['birthPlace','residence','place'],job:['job']};
function valGroups(kind){
  const g={}; Object.entries(S.people).forEach(([id,p])=>POOLS[kind].forEach(f=>{ const raw=tidy(p[f]); if(!raw) return; const k=vKey(raw); if(!k) return; const o=(g[k]=g[k]||{}); (o[raw]=o[raw]||[]).push([id,f]); }));
  const keys=Object.keys(g), par={}; keys.forEach(k=>{ par[k]=k; });
  const find=k=>par[k]===k?k:(par[k]=find(par[k]));
  for(let i=0;i<keys.length;i++) for(let j=i+1;j<keys.length;j++){ const a=keys[i], b=keys[j]; if(Math.min(a.length,b.length)>=4&&lev1(a,b)) par[find(a)]=find(b); }
  const out={}; keys.forEach(k=>{ const r=find(k), o=(out[r]=out[r]||{}); Object.entries(g[k]).forEach(([sp,arr])=>{ o[sp]=(o[sp]||[]).concat(arr); }); });
  return out;
}
const canonOf=v=>Object.entries(v).sort((a,b)=>b[1].length-a[1].length||a[0].length-b[0].length)[0][0];
function canonVal(kind,val){ const t=tidy(val); if(!t) return ''; const k=vKey(t); if(!k) return t; for(const g of Object.values(valGroups(kind))){ for(const sp of Object.keys(g)){ if(vKey(sp)===k) return canonOf(g); } } return t; }

/* ================= effective people (links by name) ================= */
function effective(){
  const R=S.people, P={}, virt=new Set();
  Object.keys(R).forEach(id=>P[id]=Object.assign({},R[id]));
  const byName={}; Object.keys(R).forEach(id=>{ const k=vKey(full(R[id])); (byName[k]=byName[k]||[]).push(id); });
  const split=n=>{ const t=norm(n).replace(/\s+/g,' ').split(' '); return t.length>1?{first:t.slice(0,-1).join(' '),last:t[t.length-1]}:{first:t[0]||'',last:''}; };
  const ghost=(key,props)=>{ if(!P[key]){ P[key]=Object.assign({first:'',last:'',gender:'',bY:0,bM:0,bD:0,dead:false,virtual:true,fatherId:'',motherId:'',spouseId:'',spl:[],photo:''},props); virt.add(key); } else { const g=P[key]; if(!g.bY&&props.bY){g.bY=props.bY;g.bM=props.bM||0;g.bD=props.bD||0;} } return key; };
  function resolve(ref,gender,fromId){
    if(!ref||!nn(ref.name)) return '';
    const k=vKey(ref.name), y=ref.y||0;
    let c=(byName[k]||[]).filter(i=>i!==fromId&&(!gender||R[i].gender===gender)&&(!y||!R[i].bY||R[i].bY===y));
    if(c.length>1&&y){ const e=c.filter(i=>R[i].bY===y); if(e.length===1) c=e; }
    if(c.length===1) return c[0];
    if(c.length>1) return '';
    const s=split(ref.name);
    return ghost('v_'+hash(k+'|'+(gender||'')+'|'+y),{first:s.first,last:s.last,gender:gender||'',bY:y,bM:ref.m||0,bD:ref.d||0});
  }
  const ids=Object.keys(R).sort();
  ids.forEach(id=>{
    const p=R[id], q=P[id], opp=p.gender==='m'?'f':p.gender==='f'?'m':'';
    q.fatherId=R[p.fatherId]?p.fatherId:resolve(p.fatherRef,'m',id);
    q.motherId=R[p.motherId]?p.motherId:resolve(p.motherRef,'f',id);
    q.spl=spListOf(p).map(x=>({id:R[x.id]?x.id:resolve(x.ref,opp,id),st:x.st||'current',my:+x.my||0,dt:x.dt||null})).filter(x=>x.id&&x.id!==id);
    q.spouseId=q.spl[0]?q.spl[0].id:'';
  });
  ids.forEach(id=>{
    String(R[id].kidNames||'').split(/\n|،|,/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
      const k=vKey(line);
      const ex=Object.keys(P).some(c=>c!==id&&(P[c].fatherId===id||P[c].motherId===id)&&(vKey(full(P[c]))===k||vKey(P[c].first)===k));
      if(ex) return;
      const me=P[id], isF=me.gender==='f', sp=P[me.spouseId]?me.spouseId:'';
      const f=isF?(sp&&P[sp].gender!=='f'?sp:''):id, m=isF?id:(sp&&P[sp].gender!=='m'?sp:'');
      /* اگر دقیقاً یک نفرِ ثبت‌شده و بدون پدر و مادر هم‌نام این فرزند باشد، همان فرزند حساب می‌شود (نه یک نفر تکراری) */
      if(f||m){ const cand=ids.filter(c=>c!==id&&c!==me.spouseId&&c!==me.fatherId&&c!==me.motherId&&!P[c].fatherId&&!P[c].motherId&&!(R[c].fatherRef&&R[c].fatherRef.name)&&!(R[c].motherRef&&R[c].motherRef.name)&&(vKey(full(P[c]))===k||(vKey(P[c].first)===k&&famKey(P[c].last)===famKey(me.last))));
        if(cand.length===1){ P[cand[0]].fatherId=f; P[cand[0]].motherId=m; return; } }
      const s=split(line);
      const vid=ghost('v_'+hash('kid|'+k+'|'+f+'|'+m),{first:s.first,last:s.last||me.last||'',gender:'',fatherId:f,motherId:m});
      P[vid].fatherId=f; P[vid].motherId=m;
    });
  });
  return {P,virt};
}

/* ================= tree model ================= */
function buildTree(){
  if(S.T) return S.T;
  const E=effective(), P=E.P, ids=Object.keys(P);
  const has=id=>!!(id&&P[id]);
  const hasParents=id=>has(P[id].fatherId)||has(P[id].motherId);
  const partners={}; ids.forEach(i=>partners[i]=new Set());
  const link=(a,b)=>{ if(a&&b&&a!==b&&has(a)&&has(b)){partners[a].add(b);partners[b].add(a);} };
  ids.forEach(i=>{ const p=P[i]; (p.spl||[]).forEach(x=>link(i,x.id)); if(has(p.fatherId)&&has(p.motherId)) link(p.fatherId,p.motherId); });
  const pst={}; ids.forEach(i=>(P[i].spl||[]).forEach(x=>{ if(!has(x.id)) return; const k=[i,x.id].sort().join('|'); if(!pst[k]||pst[k]==='current') pst[k]=x.st||'current'; }));
  const FAMN=famKey('الله‌رضایی'), isFam=i=>isAllahP(P,i), famMode=ids.some(isFam);
  const marryIn={}; ids.forEach(i=>{
    const ps=[...partners[i]];
    marryIn[i]=famMode
      ? (!isFam(i)&&ps.some(isFam))||(isFam(i)&&!hasParents(i)&&ps.some(q=>isFam(q)&&hasParents(q)))
      : (!hasParents(i)&&ps.some(q=>hasParents(q)));
  });
  const placeOf=i=>{ const p=P[i], f=has(p.fatherId)&&!marryIn[p.fatherId]?p.fatherId:null, m=has(p.motherId)&&!marryIn[p.motherId]?p.motherId:null;
    if(f&&m) return (!hasParents(f)&&hasParents(m))?m:f;   // اگر پدر بی‌پدرومادر و مادر دارای والدین است، فرزند زیر شاخهٔ مادر می‌رود
    return f||m||null; };
  const kidsOf={}; ids.forEach(i=>{ const pl=placeOf(i); if(pl&&pl!==i) (kidsOf[pl]=kidsOf[pl]||[]).push(i); });
  const byBirth=(a,b)=>{ const ya=P[a].bY,yb=P[b].bY; if(ya&&yb&&ya!==yb) return ya-yb; if(ya&&!yb) return -1; if(!ya&&yb) return 1; return (P[a].first||'').localeCompare(P[b].first||'','fa'); };
  Object.values(kidsOf).forEach(a=>a.sort(byBirth));
  const cands=ids.filter(i=>!marryIn[i]&&(!placeOf(i)||placeOf(i)===i));
  cands.sort((a,b)=>(P[a].gender==='m'?0:1)-(P[b].gender==='m'?0:1)||byBirth(a,b));
  const used=new Set(), rootSpec=[];
  cands.forEach(r=>{ if(used.has(r)) return; used.add(r); const extra=[]; partners[r].forEach(q=>{ if(cands.includes(q)&&!used.has(q)){used.add(q);extra.push(q);} }); rootSpec.push({id:r,extra}); });
  const vis=new Set(), shown=new Set(), gen={}, inlaw=new Set(); let nodes=[];
  function mk(id,extra,depth){
    if(vis.has(id)) return null; vis.add(id); shown.add(id);
    const sp=new Set(extra||[]); partners[id].forEach(q=>sp.add(q)); sp.delete(id);
    const spouses=[...sp].filter(q=>P[q]); spouses.forEach(q=>{ shown.add(q); if(gen[q]==null) gen[q]=depth; });
    if(gen[id]==null) gen[id]=depth;
    const n={id,spouses,kids:[],depth,size:0,set:null}; nodes.push(n);
    n.kids=(kidsOf[id]||[]).map(c=>mk(c,null,depth+1)).filter(Boolean);
    const set=new Set([id,...spouses]); n.kids.forEach(k=>k.set.forEach(x=>set.add(x)));
    n.set=set; n.size=set.size; return n;
  }
  let roots=rootSpec.map(r=>mk(r.id,r.extra,1)).filter(Boolean);
  /* خانوادهٔ همسر (پدر و مادر و خواهر و برادر همسر) شاخهٔ جدا نمی‌سازد؛ درخت اصلی همان است که بزرگ‌تر است */
  if(roots.length>1){
    const lc={}; ids.forEach(i=>{ const k=famKey(P[i].last); if(k) lc[k]=(lc[k]||0)+1; });
    const FAM=famKey('الله‌رضایی'), topLast=lc[FAM]?FAM:(Object.keys(lc).sort((x,y)=>lc[y]-lc[x])[0]||'');
    const score=n=>{ let c=0,t=0; const w=m=>{ t++; if(famKey(P[m.id].last)===topLast) c++; m.kids.forEach(w); }; w(n); return c*1000+t; };
    const main=roots.reduce((a,b)=>score(b)>score(a)?b:a,roots[0]), drop=new Set();
    roots.forEach(r=>{ if(r!==main&&[...r.set].some(x=>main.set.has(x))) drop.add(r); });
    if(drop.size){
      const gone=new Set(), walk=n=>{ gone.add(n); n.kids.forEach(walk); }; drop.forEach(walk);
      nodes=nodes.filter(n=>!gone.has(n));
      drop.forEach(r=>r.set.forEach(x=>{ if(!main.set.has(x)){ shown.delete(x); inlaw.add(x); } }));
      roots=roots.filter(r=>!drop.has(r));
    }
  }
  const unplaced=ids.filter(i=>!shown.has(i)).sort(byBirth), lost=unplaced.filter(i=>!inlaw.has(i));
  const couples=new Set(); ids.forEach(i=>partners[i].forEach(q=>couples.add([i,q].sort().join('|'))));
  S.T={P,virt:E.virt,roots,nodes,unplaced,lost,gen,couples:couples.size,pst};
  return S.T;
}
const EP=()=>buildTree().P;

function kinTag(id,p){

function icsBirthdays(){
  const P=EP(), pad=n=>String(n).padStart(2,'0'), esc2=t=>String(t).replace(/([,;\\])/g,'\\$1');
  const now=new Date(), stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const fmt=j=>{ const g=d2g(j); return g.gy+pad(g.gm)+pad(g.gd); };
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shajare Allahrezaei//FA','CALSCALE:GREGORIAN','X-WR-CALNAME:'+esc2('تولدهای خاندان الله‌رضایی')];
  Object.entries(P).forEach(([id,p])=>{ if(p.dead||!p.bM||!p.bD) return;
    for(let y=TODAY.y;y<=TODAY.y+2;y++){ const j=j2d(y,p.bM,Math.min(p.bD,monthLen(y,p.bM))); if(j<TODAY.jdn) continue;
      const age=p.bY?y-p.bY:null;
      L.push('BEGIN:VEVENT','UID:'+id+'-'+y+'@shajare','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+fmt(j),'DTEND;VALUE=DATE:'+fmt(j+1),'SUMMARY:'+esc2('🎂 تولد '+full(p)+(age?' ('+fa(age)+' ساله می‌شود)':'')),'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc2('تولد '+full(p)),'TRIGGER:PT9H','END:VALARM','END:VEVENT'); } });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function completeInfo(){
  const T=buildTree(), P=T.P, depth={}, out={}; T.nodes.forEach(n=>{ depth[n.id]=n.depth; });
  Object.entries(P).forEach(([id,p])=>{ if(p.virtual) return;
    const it=[], add=(k,l,w,ok)=>it.push({k,l,w,ok});
    add('birth','سال تولد',20,!!p.bY); add('date','روز و ماه تولد',8,!!(p.bM&&p.bD)); add('photo','عکس',15,!!p.photo);
    if((depth[id]||0)>1) add('parents','پدر یا مادر',20,!!(p.fatherId||p.motherId));
    if(p.dead) add('death','سال درگذشت',10,!!p.dY); else { add('place','محل سکونت یا تولد',10,!!(p.residence||p.birthPlace||p.place)); add('job','شغل',5,!!p.job); }
    add('story','سرگذشت',15,!!p.story); add('legacy','جمله برای نسل‌های آینده',5,!!p.legacy);
    const tot=it.reduce((a,x)=>a+x.w,0), got=it.reduce((a,x)=>a+(x.ok?x.w:0),0);
    out[id]={pct:Math.round(got/tot*100),missing:it.filter(x=>!x.ok)}; });
  return out;
}

function smartGenealogyAudit(){
  const P=Object.fromEntries(Object.entries(EP()).filter(([,p])=>p&&!p.virtual)), ids=Object.keys(P), info=completeInfo(), posts=(S.familyPosts||[]).filter(x=>x.status==='approved'&&x.media_path&&/\\.(jpe?g|png|webp|gif)$/i.test(x.media_path));
  const missing=Object.entries(info).filter(([,c])=>c.missing.length);
  const noBirth=ids.filter(id=>!P[id].bY), noParents=ids.filter(id=>!P[id].fatherId&&!P[id].motherId), noPhoto=ids.filter(id=>!P[id].photo&&!posts.some(x=>familyLinkedPersonIds(familyMeta(x)).includes(id)));
  const noStory=ids.filter(id=>!P[id].story), noSource=posts.filter(x=>!familyLinkedPersonIds(familyMeta(x)).length);
  const invalid=ids.filter(id=>{const p=P[id];return (p.dY&&p.bY&&p.dY<p.bY)||(p.fatherId&&P[p.fatherId]&&P[p.fatherId].gender==='f')||(p.motherId&&P[p.motherId]&&P[p.motherId].gender==='m');});
  const groups={};ids.forEach(id=>{const p=P[id],k=vKey(full(p));if(k)(groups[k]=groups[k]||[]).push(id);});
  const duplicates=Object.values(groups).filter(g=>g.length>1&&g.some(id=>g.every(q=>q===id||!P[id].bY||!P[q].bY||P[id].bY===P[q].bY)));
  const timeline=ids.flatMap(id=>{const p=P[id],a=[];if(p.bY)a.push({y:p.bY,label:'تولد '+full(p),id});if(p.dY)a.push({y:p.dY,label:'درگذشت '+full(p),id});return a;}).sort((a,b)=>a.y-b.y).slice(0,8);
  return {P,ids,missing,noBirth,noParents,noPhoto,noStory,noSource,invalid,duplicates,timeline,posts};
}

function ezafe(w){ const c=String(w).trim().slice(-1); return c==='ه'?'ٔ':(c==='ا'||c==='و')?'ی':''; }
function relGraph(){
  const T=buildTree(), P=T.P, ids=Object.keys(P), up={}, down={}, sp={};
  ids.forEach(i=>{ up[i]=[]; down[i]=[]; sp[i]=new Set(); });
  ids.forEach(i=>{ const p=P[i];
    [p.fatherId,p.motherId].forEach(q=>{ if(q&&P[q]&&q!==i&&!up[i].includes(q)){ up[i].push(q); down[q].push(i); } });
    (p.spl||[]).forEach(x=>{ if(P[x.id]&&x.id!==i){ sp[i].add(x.id); sp[x.id].add(i); } });
    if(P[p.fatherId]&&P[p.motherId]){ sp[p.fatherId].add(p.motherId); sp[p.motherId].add(p.fatherId); } });
  return {P,ids,up,down,sp,T};
}
function relPath(g,a,b){
  const {up,down,sp}=g; if(a===b) return null;
  const anc=s=>{ const d={[s]:0}, pr={}; let fr=[s]; while(fr.length){ const nx=[]; fr.forEach(x=>up[x].forEach(q=>{ if(d[q]==null){ d[q]=d[x]+1; pr[q]=x; nx.push(q); } })); fr=nx; } return {d,pr}; };
  const A=anc(a), B=anc(b); let best=null;
  Object.keys(A.d).forEach(c=>{ if(B.d[c]!=null){ const L=A.d[c]+B.d[c]; if(!best||L<best.L) best={c,L}; } });
  let blood=null;
  if(best){ const ca=[best.c]; let x=best.c; while(x!==a){ x=A.pr[x]; ca.push(x); } const cb=[best.c]; x=best.c; while(x!==b){ x=B.pr[x]; cb.push(x); } blood=ca.reverse().concat(cb.slice(1)); }
  const prev={[a]:null}; let fr=[a], full=null;
  while(fr.length&&!full){ const nx=[]; for(const x of fr){ for(const y of [...up[x],...down[x],...sp[x]]){ if(y in prev) continue; prev[y]=x; if(y===b){ full=[b]; let z=b; while(prev[z]!==null){ z=prev[z]; full.push(z); } full.reverse(); break; } nx.push(y); } if(full) break; } fr=nx; }
  if(blood&&(!full||blood.length<=full.length)) return blood;
  return full||blood;
}
function relExplain(g,nodes){
  const {P,up,down}=g; let s=''; for(let i=0;i<nodes.length-1;i++){ const x=nodes[i], y=nodes[i+1]; s+=up[x].includes(y)?'U':down[x].includes(y)?'D':'S'; }
  if(!/^U+D+$/.test(s)) return '';
  const u=s.indexOf('D'), d=s.length-u; if(u+d<3||u<1||d<1) return '';
  return `جد مشترک این دو نفر <b>${esc(full(P[nodes[u]]))}</b> است؛ ${esc(full(P[nodes[0]]))} ${fa(u)} نسل و ${esc(full(P[nodes[nodes.length-1]]))} ${fa(d)} نسل پایین‌تر از او هستند.`;
}
function relSteps(g,nodes){
  const {P,up,down}=g;

function famMarriageStats(){
  const g=relGraph(), seen=new Set(), FAM=famKey('الله‌رضایی'); let tot=0, bl=0, near=0, cousin=0, far=0, sameName=0;
  const anc=s=>{ const d={[s]:0}; let fr=[s]; while(fr.length){ const nx=[]; fr.forEach(x=>g.up[x].forEach(q=>{ if(d[q]==null){ d[q]=d[x]+1; nx.push(q); } })); fr=nx; } return d; };
  g.ids.forEach(a=>g.sp[a].forEach(b=>{ const k=[a,b].sort().join('|'); if(seen.has(k)) return; seen.add(k); tot++;
    const A=anc(a), B=anc(b); let best=null;
    Object.keys(A).forEach(c=>{ if(B[c]!=null&&c!==a&&c!==b){ const L=A[c]+B[c]; if(!best||L<best.L) best={L,u:A[c],d:B[c]}; } });
    if(best){ bl++; if(best.L<=3) near++; else if(best.u===2&&best.d===2) cousin++; else far++; }
    else if(isAllahP(g.P,a)&&isAllahP(g.P,b)) sameName++; }));
  return {tot,bl,near,cousin,far,sameName};
}

function opts(filter,sel,self,withNew,q){
  const nq=q?nn(q):'';
  const arr=Object.entries(pendingItems()).filter(([id,r])=>id!==self&&(!filter||filter(r.p))&&(!nq||id===sel||nn(pickLabel(id,r)).includes(nq))).sort((a,b)=>full(a[1].p).localeCompare(full(b[1].p),'fa'));
  return (withNew?`<option value="__new" ${sel==='__new'?'selected':''}>✍️ در فهرست نیست؛ نامش را می‌نویسم</option>`:'')+`<option value="" ${sel?'':'selected'}>— نامشخص —</option>`+arr.map(([id,r])=>`<option value="${esc(id)}" ${id===sel?'selected':''}>${esc(pickLabel(id,r))}</option>`).join('')+((nq&&!arr.length)?'<option value="" disabled>نتیجه‌ای پیدا نشد؛ گزینهٔ «در فهرست نیست» را بزنید</option>':'');
}
function yearOpts(sel){
  const hi=Math.max(nowYear,sel||0), lo=Math.min(1250,sel||1250); let o='';
  for(let y=hi;y>=lo;y--) o+=`<option value="${y}" ${sel===y?'selected':''}>${fa(y)}</option>`;
  return o;
}
function dateW(p,v){
  v=v||{};
  return `<div class="dw"><select id="${p}_d" aria-label="روز"><option value="">روز</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${v.d===i+1?'selected':''}>${fa(i+1)}</option>`).join('')}</select>
  <select id="${p}_m" aria-label="ماه"><option value="">ماه</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${v.m===i+1?'selected':''}>${n}</option>`).join('')}</select>
  <select id="${p}_y" aria-label="سال"><option value="">سال</option>${yearOpts(v.y)}</select></div>`;
}
function readDate(p){
  let y=parseInt(norm($('#'+p+'_y').value),10)||0, m=parseInt($('#'+p+'_m').value,10)||0, d=parseInt($('#'+p+'_d').value,10)||0;
  if(y&&(y<1200||y>nowYear)) y=0;
  if(m&&d&&d>monthLen(y||1403,m)) d=monthLen(y||1403,m);
  return {y,m,d};
}

function hasLivingCurrentSpouse(v){ const list=spListOf(v||{}); return !!(v&&!v.dead&&list.some(x=>{ const current=(x.st||'current')==='current'; if(!current) return false; if(x.id) return !!(S.people[x.id]&&!S.people[x.id].dead&&!S.people[x.id].virtual); return !!(x.ref&&String(x.ref.name||'').trim()); })); }
function maxPersonStep(){ const p=S.editId&&S.people[S.editId]?S.people[S.editId]:(S.prefill||{}); let ok=hasLivingCurrentSpouse(p); if($('#pform')){ try{ const mar=(document.querySelector('input[name=f_mar]:checked')||{}).value||p.marital; const alive=!$('#f_dead').checked; const candidates=readSpouses().some(x=>{ if((x.st||'current')!=='current') return false; if(x.id) return !!x.id && !(S.people[x.id]&&S.people[x.id].dead); return !!(x.ref&&String(x.ref.name||'').trim()); }); ok=alive&&(mar==='married'||hasLivingCurrentSpouse(p))&&candidates; }catch(e){ ok=hasLivingCurrentSpouse(p); } } return ok?4:3; }
function stepperHTML(n,max){ max=max||maxPersonStep(); return STEP_T.slice(0,max).map((t,i)=>`<button type="button" data-act="pgo" data-n="${i+1}" ${i+1===n?'aria-current="step"':''}><span class="num">${fa(i+1)}</span><span>${t}</span></button>`).join(''); }

  fl.forEach(F=>{ L.push('0 @F'+F.id+'@ FAM'); const mem=F.mem.slice().sort((a,b)=>(P[a].gender==='m'?0:1)-(P[b].gender==='m'?0:1));

function dupSkip(){ try{ return JSON.parse(lsGet('shj_nodup')||'{}'); }catch(e){ return {}; } }
function dupPairs(){
  const R=S.people, ids=Object.keys(R), P=EP(), skip=dupSkip(), out=[];
  const K={}; ids.forEach(i=>{ K[i]={f:vKey(full(R[i])),n:vKey(R[i].first),l:famKey(R[i].last)}; });
  for(let x=0;x<ids.length;x++) for(let y=x+1;y<ids.length;y++){
    const a=ids[x], b=ids[y], pa=R[a], pb=R[b];
    if(skip[a+'|'+b]||skip[b+'|'+a]) continue;
    if(pa.gender&&pb.gender&&pa.gender!==pb.gender) continue;
    if(pa.bY&&pb.bY&&Math.abs(pa.bY-pb.bY)>1) continue;
    const ea=P[a], eb=P[b];
    if(ea.fatherId===b||ea.motherId===a||eb.fatherId===a||eb.motherId===b||ea.fatherId===b||ea.motherId===b||eb.fatherId===a||eb.motherId===a) continue;
    if((ea.spl||[]).some(s=>s.id===b)||(eb.spl||[]).some(s=>s.id===a)) continue;
    if(ea.fatherId&&eb.fatherId&&ea.fatherId!==eb.fatherId) continue;
    if(ea.motherId&&eb.motherId&&ea.motherId!==eb.motherId) continue;
    const ka=K[a], kb=K[b]; let sc=0;
    if(ka.f&&ka.f===kb.f) sc=3;
    else if(ka.l===kb.l&&ka.n&&kb.n){ const m=Math.min(ka.n.length,kb.n.length);
      if(ka.n===kb.n||(m>=3&&lev1(ka.n,kb.n))) sc=2; else if(m>=4&&(ka.n.includes(kb.n)||kb.n.includes(ka.n))) sc=1; }
    if(sc) out.push({a,b,sc});
  }
  return out.sort((p,q)=>q.sc-p.sc);
}

async function mergePeople(keep,drop){

  const ks=spListOf(K), merged=ks.slice();

function growthChildren(){

  if(S.isAdmin) return all;

}
function growthDateFa(v){ if(!v) return ''; try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v+'T12:00:00'));}catch(e){return v;} }
const jPad=n=>String(n).padStart(2,'0');
const jToday=()=>fa(TODAY.y+'/'+jPad(TODAY.m)+'/'+jPad(TODAY.d));
const jInput=(id,val,req)=>`<input id="${id}" type="text" inputmode="numeric" dir="ltr" autocomplete="off" placeholder="${fa('1405/01/15')}" ${req?'required':''} value="${val||''}" style="text-align:center">`;
function jParse(sel){
  const t=enDigits(($(sel)||{value:''}).value).trim().replace(/[-.\s]/g,'/'); const m=t.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/); if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3]; if(y<1200||y>1500||mo<1||mo>12||d<1) return null;
  const max=mo<=6?31:mo<=11?30:(jalCal(y).leap===0?30:29); if(d>max) return null;
  const g=d2g(j2d(y,mo,d)); return g.gy+'-'+jPad(g.gm)+'-'+jPad(g.gd);
}
function growthChart(rows,key,label,unit){
  const pts=rows.filter(r=>r[key]!=null&&Number.isFinite(Number(r[key]))); if(pts.length<2) return `<p class="muted small">برای رسم نمودار ${label} حداقل دو اندازه‌گیری لازم است.</p>`;
  const vals=pts.map(r=>Number(r[key])), lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
  const xy=vals.map((v,i)=>({x:30+i*540/(vals.length-1),y:125-(v-lo)/span*90,v}));
  const poly=xy.map(p=>p.x+','+p.y).join(' ');
  return `<div class="stack" style="gap:4px"><b>${label} (${unit})</b><svg viewBox="0 0 600 160" role="img" aria-label="نمودار ${label}" style="width:100%;height:auto;max-height:190px"><line x1="25" y1="125" x2="575" y2="125" stroke="currentColor" opacity=".25"/><polyline points="${poly}" fill="none" stroke="#168a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#168a72"><title>${esc(growthDateFa(pts[i].recorded_on))}: ${p.v} ${unit}</title></circle>`).join('')}<text x="30" y="150" font-size="12" fill="currentColor">${esc(growthDateFa(pts[0].recorded_on))}</text><text x="570" y="150" text-anchor="end" font-size="12" fill="currentColor">${esc(growthDateFa(pts[pts.length-1].recorded_on))}</text><text x="570" y="18" text-anchor="end" font-size="13" fill="currentColor">${fa(hi)} ${unit}</text><text x="570" y="140" text-anchor="end" font-size="13" fill="currentColor">${fa(lo)} ${unit}</text></svg></div>`;
}

function pwIssues(v){
  const b=[], n=[...v].length;
  if(n<10) b.push('حداقل ۱۰ نویسه');
  if(new TextEncoder().encode(v).length>72) b.push('حداکثر ۷۲ بایت (حدود ۷۰ حرف انگلیسی)');
  const cls=[/[a-zآ-ی]/.test(v),/[A-Z]/.test(v),/[0-9۰-۹]/.test(v),/[^A-Za-z0-9آ-ی۰-۹\s]/.test(v)].filter(Boolean).length;
  if(cls<3) b.push('ترکیب حداقل ۳ نوع: حرف کوچک، حرف بزرگ انگلیسی، عدد، نماد');
  if(/(.)\1{3,}/.test(v)) b.push('بدون تکرار یک نویسه ۴ بار پشت‌سرهم');
  if(/password|passw0rd|qwerty|letmein|iloveyou|admin|welcome|12345678|123456789|abcdefgh/i.test(v)) b.push('نباید رمز رایج باشد');
  return b;
}
const pwHint=v=>{ if(!v) return ''; const i=pwIssues(v); return i.length?'⚠️ '+i.join('؛ '):'✅ رمز قوی است'; };
const PW_NOTE='رمز را مثل سایت‌های معتبر انتخاب کنید: حداقل ۱۰ نویسه با ترکیب حرف کوچک، حرف بزرگ انگلیسی، عدد و نماد. یک جملهٔ بلند هم عالی است. این رمز را در سایت دیگری استفاده نکنید.';
function askForm(title,fields,okLabel,note){
  return new Promise(res=>{
    const w=document.createElement('div'); w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
    w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:12px';
    w.innerHTML=`<div class="card stack" style="max-width:430px;width:100%;max-height:90vh;overflow:auto"><h3>${esc(title)}</h3>${note?`<p class="muted small">${esc(note)}</p>`:''}${fields.map(f=>`<label class="f"><span>${esc(f.label)}</span><input id="af_${f.id}" type="${f.type||'text'}" ${f.type==='password'?`autocomplete="${f.strength?'new-password':'current-password'}" dir="ltr"`:'autocomplete="off"'}></label>${f.strength?`<div class="small muted" id="af_m_${f.id}" aria-live="polite"></div>`:''}`).join('')}<div class="row"><button class="btn big" data-af="ok">${esc(okLabel||'تأیید')}</button><button class="btn ghost" data-af="no">انصراف</button></div></div>`;
    document.body.appendChild(w);
    const done=v=>{ w.remove(); res(v); };
    fields.filter(f=>f.strength).forEach(f=>{ const inp=w.querySelector('#af_'+f.id), m=w.querySelector('#af_m_'+f.id); inp.addEventListener('input',()=>{ m.textContent=pwHint(inp.value); }); });
    const submit=()=>{ const out={}; fields.forEach(f=>{ out[f.id]=w.querySelector('#af_'+f.id).value; }); done(out); };
    w.addEventListener('click',ev=>{ const b=ev.target.closest('[data-af]'); if(!b) return; ev.stopPropagation(); if(b.dataset.af==='no') done(null); else submit(); });
    w.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); submit(); } else if(ev.key==='Escape') done(null); });
    const first=w.querySelector('input'); if(first) first.focus();
  });
}

function familyMeta(post){
  const raw=String(post.description||'');
  if(raw.startsWith(FAMILY_ARCHIVE_MARK)){
    try{return Object.assign({story:'',category:'other',village:'',photo_year:'',person_id:'',person_name:'',contributor:'',section:'documents',certainty:'unverified',source:''},JSON.parse(raw.slice(FAMILY_ARCHIVE_MARK.length)));}
    catch(e){}
  }
  return {story:raw,category:'other',village:'',photo_year:'',person_id:'',person_name:'',contributor:'',section:'documents',certainty:'unverified',source:''};
}
function familyLinkedPersonIds(meta){
  const ids=Array.isArray(meta.person_ids)?meta.person_ids.filter(Boolean):[];
  if(!ids.length&&meta.person_id)ids.push(meta.person_id);
  return [...new Set(ids)];
}
function familyLinkedPeople(meta){
  return familyLinkedPersonIds(meta).map(id=>({id,person:S.people[id]})).filter(x=>x.person);
}
function familyMetaText(meta){
  const parts=[FAMILY_CATEGORIES[meta.category]||'یادگار خانوادگی',meta.village||'',meta.photo_year||'',meta.person_name||'',meta.contributor||''];
  return parts.filter(Boolean).join(' · ');
}
function familyMediaUrl(post){
  if(!post.media_path) return '';
  if(post.status==='approved'&&post.visibility==='public') return CFG.url+'/storage/v1/object/public/shj-family-public/'+post.media_path.split('/').map(encodeURIComponent).join('/');
  return post.media_url||'';
}
async function loadFamilyPosts(){
  const rows=await sbFetch('/rest/v1/shj_family_posts?select=id,title,description,media_path,visibility,status,created_at&order=created_at.desc&limit=1000');
  const list=Array.isArray(rows)?rows:[];
  await Promise.all(list.map(async p=>{
    p.media_url='';
    if(p.media_path&&!(p.status==='approved'&&p.visibility==='public')){
      try{const r=await sbFetch('/storage/v1/object/sign/shj-family-pending/'+p.media_path.split('/').map(encodeURIComponent).join('/'),{method:'POST',body:JSON.stringify({expiresIn:3600})});p.media_url=r&&r.signedURL?(String(r.signedURL).startsWith('http')?r.signedURL:CFG.url+'/storage/v1'+r.signedURL):'';}catch(e){}
    }
  }));
  S.familyPosts=list;
  if(S.tab==='family'||S.tab==='tools'||S.tab==='admin') renderView();
}
function familyErrText(e){
  const c=e&&e.code,m=String((e&&e.message)||'');
  if(c===401)return 'نشست شما منقضی شده؛ دوباره وارد شوید.';
  if(c===403||/row-level|policy/i.test(m))return 'سیاست دسترسی پایگاه داده این کار را اجازه نمی‌دهد.';
  if(c===413||/too large|exceeded/i.test(m))return 'حجم فایل بیش از حد مجاز است.';
  if(c===415||/mime/i.test(m))return 'نوع فایل مجاز نیست.';
  if(/failed to fetch|network/i.test(m))return 'اتصال اینترنت برقرار نیست.';
  return m||'خطای نامشخص؛ دوباره تلاش کنید.';
}
async function familyShrink(file,ext){
  if(!['jpg','png','webp'].includes(ext)||!window.createImageBitmap)return {blob:file,ext};
  try{
    const bmp=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<1.5*1024*1024)return {blob:file,ext};
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob&&blob.size<file.size?{blob,ext:'jpg'}:{blob:file,ext};
  }catch(e){return {blob:file,ext};}
}

async function saveFamilyEdit(){
  if(!S.isAdmin)return;
  const id=familyArchiveUI.editId,post=(S.familyPosts||[]).find(x=>x.id===id);if(!post)return;
  const g=k=>($('#fe_'+k)?.value||'').trim(),title=g('title'),story=g('story');
  if(!title||!story){toast('عنوان و شرح نمی‌توانند خالی باشند.');return;}
  const meta=Object.assign(familyMeta(post),{story,section:g('section'),category:g('category'),village:g('village'),photo_year:g('year'),certainty:g('certainty'),source:g('source')});
  await sbFetch('/rest/v1/shj_family_posts?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({title,description:FAMILY_ARCHIVE_MARK+JSON.stringify(meta)})});
  familyArchiveUI.editId='';await loadFamilyPosts();renderView();toast('یادگار اصلاح شد.');
}

async function removeFamilyFile(post){
  if(!post||!post.media_path)return true;
  const pub=post.status==='approved'&&post.visibility==='public',bucket=pub?'shj-family-public':'shj-family-pending',path=post.media_path.split('/').map(encodeURIComponent).join('/');
  try{await sbFetch('/storage/v1/object/'+bucket+'/'+path,{method:'DELETE'});}catch(e){console.error(e);}
  if(pub){try{const r=await fetch(CFG.url+'/storage/v1/object/public/'+bucket+'/'+path,{method:'HEAD',cache:'no-store'});return !r.ok;}catch(e){return false;}}
  return true;
}
async function cancelFamilyPost(id){
  if(!S.isAdmin)throw new Error('فقط مدیر می‌تواند انتشار را لغو کند.');
  const post=(S.familyPosts||[]).find(x=>x.id===id);if(!post)return;
  if(!confirm('این یادگار از کتابچه خارج و فایل پیوست آن برای همیشه از فضای ذخیره‌سازی حذف شود؟'))return;
  const ok=await removeFamilyFile(post);
  await sbFetch('/rest/v1/shj_family_posts?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'rejected',media_path:ok?null:post.media_path})});
  await loadFamilyPosts();
  toast(ok?'یادگار لغو و فایل آن حذف شد.':'انتشار لغو شد، اما فایل هنوز در فضای ذخیره‌سازی است؛ سیاست حذف (Storage policy) را بررسی کنید.');

async function approveFamilyPost(id){

async function uploadFamilyBook(file){
  if(!S.isAdmin)throw new Error('فقط مدیر خانواده می‌تواند کتابچه را بارگذاری کند.');
  if(!file||file.type!=='application/pdf')throw new Error('لطفاً فایل PDF کتابچه را انتخاب کنید.');
  if(file.size>20*1024*1024)throw new Error('حجم فایل نباید بیشتر از ۲۰ مگابایت باشد.');
  if(await sniffFamilyFile(file)!=='pdf')throw new Error('این فایل PDF معتبر نیست.');
  toast('در حال بارگذاری کتابچه…');
  await sbFetch('/storage/v1/object/shj-family-public/'+FAMILY_BOOK_PATH,{method:'POST',headers:{'Content-Type':'application/pdf','x-upsert':'true'},body:file});
  familyBookState.url=familyBookPublicUrl();familyBookState.page=1;familyBookState.zoom=100;

}

let familyBusy=false;
const FAMILY_FILE_TYPES={jpg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',pdf:'application/pdf'};
async function sniffFamilyFile(file){
  const b=new Uint8Array(await file.slice(0,12).arrayBuffer()),at=(i,a)=>a.every((v,k)=>b[i+k]===v);
  if(at(0,[0xFF,0xD8,0xFF]))return 'jpg'; if(at(0,[0x89,0x50,0x4E,0x47]))return 'png'; if(at(0,[0x47,0x49,0x46,0x38]))return 'gif';
  if(at(0,[0x52,0x49,0x46,0x46])&&at(8,[0x57,0x45,0x42,0x50]))return 'webp'; if(at(0,[0x25,0x50,0x44,0x46]))return 'pdf';
  return null;
}
async function submitFamilyContribution(){
  if(familyBusy)return;
  if(!S.authed||!S.me||!S.me.first){toast('برای ثبت یادگار ابتدا وارد شوید و نام خود را مشخص کنید.');return;}
  const title=($('#fc_title')?.value||'').trim(),story=($('#fc_story')?.value||'').trim();
  if(!title||!story){toast('عنوان و شرح یادگار را وارد کنید.');return;}
  if(!$('#fc_consent')?.checked){toast('لطفاً تأیید انتشار را بزنید.');return;}
  const pids=Array.from($('#fc_persons')?.selectedOptions||[]).map(o=>o.value).filter(id=>S.people[id]),pid=pids[0]||'',typed=($('#fc_people')?.value||'').trim(),yr=($('#fc_year')?.value||'').trim();
  if(yr&&!/[0-9۰-۹٠-٩]/.test(yr)){toast('سال را با عدد بنویسید؛ مثلاً ۱۳۴۵ یا دههٔ ۱۳۲۰.');return;}
  if($('#fc_village')?.value==='سایر'&&!($('#fc_village_other')?.value||'').trim()){toast('نام روستا یا محل را بنویسید.');return;}
  const linkedNames=pids.map(id=>full(S.people[id]));
  const meta={story,person_ids:pids,person_id:pid,section:$('#fc_section').value,category:$('#fc_category').value,village:($('#fc_village').value==='سایر'?($('#fc_village_other').value||'').trim():$('#fc_village').value),photo_year:($('#fc_year').value||'').trim(),person_name:linkedNames.join('، '),people_names:typed,source:($('#fc_source').value||'').trim(),certainty:'unverified',consent:true,contributor:fullName()};
  const id=(crypto.randomUUID?crypto.randomUUID():('f'+Date.now()+Math.random().toString(16).slice(2)));
  const isAdm=!!S.isAdmin,bucket=isAdm?'shj-family-public':'shj-family-pending';
  let media_path=null; const file=$('#fc_file')?.files?.[0];
  familyBusy=true;
  try{
    if(file){
      if(file.size>20*1024*1024)throw new Error('حجم فایل نباید بیشتر از ۲۰ مگابایت باشد.');
      const ext=await sniffFamilyFile(file);
      if(!ext)throw new Error('فقط عکس (JPG، PNG، WebP، GIF) یا PDF مجاز است.');
      const sh=await familyShrink(file,ext);
      media_path='family/'+id+'.'+sh.ext;
      await sbFetch('/storage/v1/object/'+bucket+'/'+media_path,{method:'POST',headers:{'Content-Type':FAMILY_FILE_TYPES[sh.ext],'x-upsert':'false'},body:sh.blob});
    }
    try{
      await sbFetch('/rest/v1/shj_family_posts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id,title,description:FAMILY_ARCHIVE_MARK+JSON.stringify(meta),media_path,visibility:'public',status:isAdm?'approved':'pending'})});
    }catch(e){ if(media_path)await sbFetch('/storage/v1/object/'+bucket+'/'+media_path,{method:'DELETE'}).catch(()=>{}); throw e; }
    await loadFamilyPosts();
    if(!isAdm){renderView();toast('یادگار ثبت شد و پس از تأیید مدیر در کتابچه منتشر می‌شود.');return;}
    S.tab='book';
    const bookPages=familyDigitalBookPages();
    const target=bookPages.findIndex(pg=>pg.html.includes(esc(title)));
    familyDigitalState.page=target>=0?target:1;
    renderView();
    toast('یادگار منتشر شد؛ صفحهٔ مربوط در کتابچه باز شد.');
  }catch(e){console.error(e);toast('ثبت انجام نشد: '+familyErrText(e));}
  finally{familyBusy=false;}
}

    <div class="row"><button class="btn" data-act="fillvirt" data-id="${esc(id)}">ثبت اطلاعات ${esc(p.first)}</button></div>`;

  const kids=Object.keys(P).filter(i=>P[i].fatherId===id||P[i].motherId===id);
  const sib=Object.keys(P).filter(i=>i!==id&&((p.fatherId&&P[i].fatherId===p.fatherId)||(p.motherId&&P[i].motherId===p.motherId)));
  const spouses=new Set(); (p.spl||[]).forEach(x=>{ if(P[x.id]) spouses.add(x.id); }); Object.keys(P).forEach(i=>{ if((P[i].spl||[]).some(x=>x.id===id)) spouses.add(i); }); kids.forEach(k=>{ const o=P[k].fatherId===id?P[k].motherId:P[k].fatherId; if(P[o]) spouses.add(o); });
  const rows=[['پدر',P[p.fatherId]?[p.fatherId]:[]],['مادر',P[p.motherId]?[p.motherId]:[]],['همسر',[...spouses]],['فرزندان',kids],['برادر و خواهر',sib]].filter(r=>r[1].length);

  const a=ageNow(p);
  const wed=[...spouses].flatMap(q=>{ const x=(P[id].spl||[]).find(y=>y.id===q)||(P[q].spl||[]).find(y=>y.id===id); if(!x||!x.dt) return []; const t=[['nishan','نشان'],['aghd','عقد'],['aroosi','عروسی']].map(([n,l])=>x.dt[n]&&dstr(x.dt[n].y,x.dt[n].m,x.dt[n].d)?l+' '+dstr(x.dt[n].y,x.dt[n].m,x.dt[n].d):'').filter(Boolean); return t.length?['همسر '+(P[q].first||'')+': '+t.join('، ')]:[]; });

}

const PW=240, PH=320;
async function toBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ const url=URL.createObjectURL(file); const im=await loadImg(url); if(!im) throw new Error('bad image'); return im; }

async function standardPhoto(file){
  const bmp=await toBitmap(file), iw=bmp.width, ih=bmp.height;
  const s0=Math.min(1,1280/Math.max(iw,ih)), tw=Math.round(iw*s0), th=Math.round(ih*s0);
  const src=document.createElement('canvas'); src.width=tw; src.height=th; src.getContext('2d').drawImage(bmp,0,0,tw,th);
  let face=null, mode='center';
  if(!face&&'FaceDetector' in window){ try{ const fd=new window.FaceDetector({maxDetectedFaces:1}); const r=await fd.detect(src); if(r&&r[0]){ const b=r[0].boundingBox; face={x:b.x,y:b.y,w:b.width,h:b.height}; mode='ai'; } }catch(e){} }
  let fw,fh,fx,fy; // frame in source pixels (3:4)
  if(face){ fh=face.h/0.50; fw=fh*PW/PH; fx=face.x+face.w/2-fw/2; fy=face.y-0.17*fh; }
  else { fh=Math.min(th,tw*PH/PW); fw=fh*PW/PH; fx=(tw-fw)/2; fy=Math.max(0,Math.min(th-fh,(th-fh)*0.25)); }
  const out=document.createElement('canvas'); out.width=PW; out.height=PH; const o=out.getContext('2d');
  const bgG=o.createLinearGradient(0,0,0,PH); bgG.addColorStop(0,'#e9efec'); bgG.addColorStop(1,'#cdd9d4'); o.fillStyle=bgG; o.fillRect(0,0,PW,PH);
  const k=PW/fw, sx=Math.max(0,fx), sy=Math.max(0,fy), ex=Math.min(tw,fx+fw), ey=Math.min(th,fy+fh);
  if(ex>sx&&ey>sy) o.drawImage(src,sx,sy,ex-sx,ey-sy,(sx-fx)*k,(sy-fy)*k,(ex-sx)*k,(ey-sy)*k);
  // gentle auto-levels so lighting looks alike
  try{ const d=o.getImageData(0,0,PW,PH), a=d.data, hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4) hist[Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2])]++;
    const tot=PW*PH; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>tot*.01){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>tot*.01){hi=i;break;} }
    if(hi-lo>40){ const sc=255/(hi-lo), mix=.6; for(let i=0;i<a.length;i+=4) for(let j=0;j<3;j++){ const v=(a[i+j]-lo)*sc; a[i+j]=Math.max(0,Math.min(255,a[i+j]*(1-mix)+v*mix)); } o.putImageData(d,0,0); } }catch(e){}
  return {data:out.toDataURL('image/jpeg',.78),mode};
}

function autoLevels(o){
  try{ const d=o.getImageData(0,0,PW,PH), a=d.data, hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4) hist[Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2])]++;
    const tot=PW*PH; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>tot*.01){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>tot*.01){hi=i;break;} }
    if(hi-lo>40){ const sc=255/(hi-lo), mix=.6; for(let i=0;i<a.length;i+=4) for(let j=0;j<3;j++){ const v=(a[i+j]-lo)*sc; a[i+j]=Math.max(0,Math.min(255,a[i+j]*(1-mix)+v*mix)); } o.putImageData(d,0,0); } }catch(e){}
}
/* manual 3:4 crop: drag to move, slider/wheel to zoom; face auto-placed when the browser supports FaceDetector */
async function cropPhoto(file){
  const bmp=await toBitmap(file), iw=bmp.width, ih=bmp.height;
  const s0=Math.min(1,1600/Math.max(iw,ih)), tw=Math.round(iw*s0), th=Math.round(ih*s0);
  const src=document.createElement('canvas'); src.width=tw; src.height=th; src.getContext('2d').drawImage(bmp,0,0,tw,th);
  const VW=300, VH=400, base=Math.max(VW/tw,VH/th);
  let z=1, ox=0, oy=0, face=null;
  if('FaceDetector' in window){ try{ const r=await new window.FaceDetector({maxDetectedFaces:1}).detect(src); if(r&&r[0]){ const b=r[0].boundingBox; face={x:b.x,y:b.y,w:b.width,h:b.height}; } }catch(e){} }
  const clamp=()=>{ const sc=base*z, mx=Math.max(0,(tw*sc-VW)/2), my=Math.max(0,(th*sc-VH)/2); ox=Math.max(-mx,Math.min(mx,ox)); oy=Math.max(-my,Math.min(my,oy)); };
  if(face){ z=Math.max(1,Math.min(4,(0.5*VH/face.h)/base)); const sc=base*z; ox=-(face.x+face.w/2-tw/2)*sc; oy=0.17*VH-VH/2-(face.y-th/2)*sc; }
  else { oy=Math.max(0,(th*base-VH)/2)*0.6; }
  clamp();
  return new Promise(resolve=>{
    const bg=document.createElement('div'); bg.className='crop-bg';
    bg.innerHTML=`<div class="crop-box" role="dialog" aria-modal="true"><div style="font-weight:700">تنظیم عکس</div>
      <div class="muted small" style="text-align:center">عکس را با انگشت یا ماوس جابه‌جا کنید تا چهره داخل بیضی بیفتد. با لغزنده بزرگ‌نمایی کنید.</div>
      <div class="crop-view" id="cv"><canvas width="${VW*2}" height="${VH*2}"></canvas><div class="crop-oval"></div></div>
      <input type="range" id="cz" min="1" max="4" step="0.01" value="${z}" aria-label="بزرگ‌نمایی">
      <div class="row"><button type="button" class="btn" id="cok">تأیید</button><button type="button" class="btn ghost" id="cno">انصراف</button></div></div>`;
    document.body.appendChild(bg);
    const view=bg.querySelector('#cv'), cv=view.querySelector('canvas'), c=cv.getContext('2d'), zr=bg.querySelector('#cz');
    const draw=(ctx,k,w,h)=>{ const sc=base*z*k; ctx.fillStyle='#d6e0dc'; ctx.fillRect(0,0,w,h); ctx.drawImage(src,w/2+ox*k-tw*sc/2,h/2+oy*k-th*sc/2,tw*sc,th*sc); };
    const paint=()=>draw(c,2,VW*2,VH*2);
    paint();
    const rect=()=>view.getBoundingClientRect();
    let drag=null;
    view.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,ox,oy}; view.setPointerCapture(e.pointerId); view.style.cursor='grabbing'; });
    view.addEventListener('pointermove',e=>{ if(!drag) return; const f=VW/rect().width; ox=drag.ox+(e.clientX-drag.x)*f; oy=drag.oy+(e.clientY-drag.y)*f; clamp(); paint(); });
    const up=()=>{ drag=null; view.style.cursor='grab'; };
    view.addEventListener('pointerup',up); view.addEventListener('pointercancel',up);
    view.addEventListener('wheel',e=>{ e.preventDefault(); z=Math.max(1,Math.min(4,z*(e.deltaY<0?1.06:.94))); zr.value=z; clamp(); paint(); },{passive:false});
    zr.addEventListener('input',()=>{ z=parseFloat(zr.value)||1; clamp(); paint(); });
    const done=v=>{ bg.remove(); resolve(v); };
    bg.querySelector('#cno').onclick=()=>done(null);
    bg.querySelector('#cok').onclick=()=>{
      const out=document.createElement('canvas'); out.width=PW; out.height=PH; const o=out.getContext('2d');
      draw(o,PW/VW,PW,PH); autoLevels(o); done(out.toDataURL('image/jpeg',.82));
    };
  });
}

  if(!pid){ toast('فرد مورد نظر را انتخاب کنید'); return; }
  if(!text){ toast('متن را بنویسید'); return; }
  const yearText=val('#m_eventYear').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const eventYear=Math.max(0,Math.min(1600,parseInt(yearText||'0',10)||0)),eventPlace=val('#m_eventPlace');
  const payload={personId:pid,text,kind,author:S.isAdmin?fullName():'',eventYear,eventPlace};
  const btn=$('#mform button[type=submit]'); btn.disabled=true;
  try{
    if(S.isAdmin){ await S.db.doc('memories/'+newId('m')).set(Object.assign({at:Date.now()},payload)); toast('ثبت شد'); }
    else{ const r=await deliver('memory',payload,newId('m'),''); toast(r==='sent'?'ارسال شد. بعد از تأیید مدیر نمایش داده می‌شود':'متن ارسال را کپی کنید و برای مدیر بفرستید'); }
    S.memFor=''; const wasCode=!!S.code; $('#formArea').innerHTML=memoryForm(); if(wasCode) showCode(); else $('#codeArea').innerHTML='';
    const ms=$('#mySubs'); if(ms) ms.innerHTML=mySubsHTML();
  }catch(e){ toast(friendlyErr(e)); const b2=$('#mform button[type=submit]'); if(b2) b2.disabled=false; }
}

function findPending(k){ const [uid,id]=k.split('|'); return pendingList().find(x=>x.uid===uid&&x.id===id); }
async function markSub(it,status){
  if(it.uid==='__import'){ S.imported=S.imported.filter(x=>x.id!==it.id); return; }
  const patch={status}; if(it.kind==='person'&&it.payload&&it.payload.photo) patch.payload={photo:''};
  await S.db.doc('subs/'+it.uid+'_'+it.id).update(patch);
}
async function approveOne(it){
  if(it.kind==='person'){
    const tid=it.editOf||it.id, ref=S.db.doc('people/'+tid);
    histPush((it.editOf?'تأیید ویرایش ':'تأیید ثبت ')+full(it.payload),it.editOf&&S.people[tid]?[[tid,pickF(S.people[tid],Object.keys(it.payload))]]:[]);
    if(it.editOf) await ref.update(it.payload); else await ref.set(Object.assign({createdBy:it.by||'',createdAt:it.at},it.payload));
  } else {
    await S.db.doc('memories/'+it.id).set(Object.assign({kind:'memory'},it.payload,{author:it.payload.author||it.by||'',at:it.at}));
  }
  await markSub(it,'approved');
}
async function doImport(){
  const lines=($('#impTxt').value||'').split(/\s+/).filter(l=>l.startsWith('SHJ1:')); let n=0;
  lines.forEach(l=>{ try{ const o=JSON.parse(decodeURIComponent(escape(atob(l.slice(5)))));
    if(!o||!o.p||!o.id||(o.k!=='person'&&o.k!=='memory')) return;
    if(S.imported.some(x=>x.id===o.id)||pendingList().some(x=>x.id===o.id)) return;
    S.imported.push({id:o.id,kind:o.k,payload:o.p,by:o.by,at:o.at||Date.now(),status:'pending',editOf:o.e||''}); n++; }catch(e){} });
  toast(n?fa(n)+' مورد به فهرست تأیید اضافه شد':'متن معتبری پیدا نشد'); $('#impTxt').value=''; renderNav(); renderView();
}

(function(){

  const boxOf=e=>e.target.closest&&e.target.closest('#chartBox,.outline,#artBox');

/* ================= Supabase layer ================= */
const CFG=Object.assign({url:'',key:'',familyEmail:'',adminEmail:''},window.SHJ_CONFIG||{});
const SB={tok:null,refresh:null,email:''};
const sbReady=()=>!!(CFG.url&&CFG.key&&CFG.familyEmail&&CFG.adminEmail)&&!/PASTE/i.test(CFG.url+CFG.key+CFG.adminEmail);
function sbSave(){ lsSet(SESSION_KEY,JSON.stringify({r:SB.refresh,e:SB.email})); }
async function sbAuth(body,grant){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw {code:r.status,message:j.error_description||j.msg||j.message||'خطا'};
  SB.tok=j.access_token; SB.refresh=j.refresh_token; SB.email=(j.user&&j.user.email)||SB.email; sbSave(); return j;
}
let sbRefreshing=null;
const sbRefresh=()=>sbRefreshing||(sbRefreshing=sbAuth({refresh_token:SB.refresh},'refresh_token').finally(()=>{ sbRefreshing=null; }));
async function sbFetch(path,opt){
  opt=opt||{};
  const go=()=>fetch(CFG.url+path,{method:opt.method||'GET',headers:Object.assign({apikey:CFG.key,Authorization:'Bearer '+(SB.tok||CFG.key),'Content-Type':'application/json'},(sessionStorage.getItem('shj_parent_token')?{'x-shj-parent-token':sessionStorage.getItem('shj_parent_token')} : {}),opt.headers||{}),body:opt.body});
  let r=await go();
  if(r.status===401&&SB.refresh&&!opt.retried){ try{ await sbRefresh(); }catch(e){} opt.retried=1; r=await go(); }
  if(!r.ok) throw {code:r.status,message:await r.text().catch(()=>'')};
  const t=await r.text(); return t?JSON.parse(t):null;
}
function dmerge(a,b){ const o=Object.assign({},a); for(const k in b){ const v=b[k]; o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?dmerge(o[k],v):v; } return o; }
const kv={ _p:null,
  open(){ return this._p||(this._p=new Promise(res=>{ try{ const r=indexedDB.open('shj',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } })); },
  async get(k){ const db=await this.open(); if(!db) return null; return new Promise(res=>{ try{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result==null?null:q.result); q.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async set(k,v){ const db=await this.open(); if(!db) return; return new Promise(res=>{ try{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); }catch(e){ res(); } }); },
  async del(k){ const db=await this.open(); if(!db) return; return new Promise(res=>{ try{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }catch(e){ res(); } }); }
};
const rowsToObj=rows=>{ const o={}; (rows||[]).forEach(x=>{ o[String(x.path).split('/').pop()]=x.data; }); return o; };
function setOffline(f){
  S.offline=!!f; let b=document.getElementById('offBanner');
  if(f&&!b){ b=document.createElement('div'); b.id='offBanner'; b.className='offbar'; b.textContent='اتصال به سرور برقرار نیست؛ آخرین اطلاعات ذخیره‌شده نمایش داده می‌شود. ثبت و ویرایش تا برقراری اتصال ممکن نیست.'; document.body.prepend(b); }
  else if(!f&&b) b.remove();
}
async function persistPersonAudit(path,before,after,action){
  if(!S.isAdmin||!path.startsWith('people/'))return;
  const fields=['first','last','gender','bY','bM','bD','dead','dY','dM','dD','fatherId','motherId','spouseId','spouses','birthPlace','residence','job','note','story','legacy'];
  const clean=o=>Object.fromEntries(fields.filter(k=>o&&o[k]!==undefined).map(k=>[k,o[k]]));
  const b=clean(before||{}),a=clean(after||{}),changed=fields.filter(k=>JSON.stringify(b[k])!==JSON.stringify(a[k]));
  if(!changed.length&&action!=='حذف')return;
  const id=newId('audit'),row={path:'genealogy_audit/'+id,parent:'genealogy_audit',data:{personId:path.split('/').pop(),personName:full(after||before||{}),action,fields:changed,before:b,after:a,by:fullName()||'مدیر',at:Date.now()},updated_at:new Date().toISOString()};
  await sbFetch('/rest/v1/shj_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
}
function mkDb(){
  const enc=encodeURIComponent, parentOf=p=>p.split('/').slice(0,-1).join('/');
  const pollers=new Set(); let timer=null;
  const poke=()=>setTimeout(()=>pollers.forEach(f=>f()),60);
  const ensure=()=>{ if(timer) return; timer=setInterval(()=>{ if(!document.hidden) pollers.forEach(f=>f()); },20000); };
  const snapDoc=(path,data)=>({id:path.split('/').pop(),exists:data!=null,data:()=>data});
  const doc=path=>({
    id:path.split('/').pop(), path,
    async get(){ const r=await sbFetch('/rest/v1/shj_docs?select=data&path=eq.'+enc(path)); return snapDoc(path,r&&r[0]?r[0].data:null); },
    async set(d){
      const row={path,parent:parentOf(path),data:d,updated_at:new Date().toISOString()};
      if(S.isAdmin){
        const upd=await sbFetch('/rest/v1/shj_docs?path=eq.'+enc(path),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:d,updated_at:row.updated_at})});
        if(!upd||!upd.length) await sbFetch('/rest/v1/shj_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
      }
      else await sbFetch('/rest/v1/shj_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
      poke();
    },
    async update(d){ const cur=await this.get(); if(!cur.exists) throw {code:'invalid_argument'}; const before=cur.data(),after=dmerge(before,d); await this.set(after); try{await persistPersonAudit(path,before,after,'ویرایش پرونده');}catch(e){console.warn('audit log unavailable',e);} },
    async delete(){ const cur=await this.get(); await sbFetch('/rest/v1/shj_docs?path=eq.'+enc(path),{method:'DELETE'}); if(cur.exists) try{await persistPersonAudit(path,cur.data(),null,'حذف');}catch(e){console.warn('audit log unavailable',e);} poke(); }
  });
  const collection=parent=>({
    onSnapshot(next,err,initSig){
      let sig=initSig||'';
      const run=async()=>{
        try{
          const meta=await sbFetch('/rest/v1/shj_docs?select=path,updated_at&parent=eq.'+enc(parent)+'&order=path.asc&limit=5000');
          if(S.offline) setOffline(false);
          const sg=JSON.stringify(meta); if(sg===sig) return;
          const rows=await sbFetch('/rest/v1/shj_docs?select=path,data&parent=eq.'+enc(parent)+'&order=path.asc&limit=5000');
          sig=sg; next({docs:(rows||[]).map(x=>snapDoc(x.path,x.data)),size:(rows||[]).length});
          if(parent==='people'||parent==='memories'){ try{ kv.set('col:'+parent,JSON.stringify({sig:sg,rows:rows||[]})); }catch(e){} }
        }catch(e){ if(err) err({code:(e&&e.code)||'unavailable'}); }
      };
      pollers.add(run); ensure(); run(); return ()=>pollers.delete(run);
    }
  });
  return {doc,collection};
}
function startData(){
  const db=mkDb(); S.db=db;
  const err=e=>{ if(S.hadCache&&Object.keys(S.people).length){ setOffline(true); return; } S.dbError=(e&&e.code)||'خطا'; render(); };
  const cs=S.cacheSig||{};
  db.collection('people').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.people=o; S.peopleLoaded=true; S.dbError=null; if(S.loginPending) render(); else changed(); },err,cs.people);
  db.collection('memories').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.memories=o; changed(); },err,cs.memories);
  db.collection('research_questions').onSnapshot(s=>{ S.researchRows=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); changed(); },()=>{});
  db.collection('genealogy_audit').onSnapshot(s=>{ S.auditRows=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||0)-(a.at||0)); changed(); },()=>{});

  setInterval(()=>{ if(SB.refresh) sbRefresh().catch(()=>{}); },40*60*1000);
  startSubs();
}
function startSubs(){
  if(!S.isAdmin||S.subsOn||!S.db) return; S.subsOn=true;
  S.db.collection('subs').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>{ const x=d.data(); const u=x.uid||'?'; (o[u]=o[u]||{items:{}}).items[x.id]=x; }); S.subs=o; changed(); },()=>{});
}
const enDigits=t=>String(t).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
async function doLogin(){
  let f=($('#l_first')||{}).value.trim(), l=($('#l_last')||{}).value.trim(); if(!f||!l) return;
  const btn=document.querySelector('#loginForm button[type=submit]'); if(btn) btn.disabled=true;
  try{
    if(S.adminLogin){
      await sbAuth({email:$('#l_email').value.trim(),password:enDigits($('#l_pass').value)},'password');
      if(SB.email.toLowerCase()!==CFG.adminEmail.toLowerCase()){ SB.tok=null; SB.refresh=null; lsSet(SESSION_KEY,''); S.authed=false; throw {message:'این حساب مدیر نیست'}; }
      S.isAdmin=true; S.me={first:f,last:l}; lsSet('shj_me',JSON.stringify(S.me));
    } else {
      if(!S.loginSelected&&!S.loginNewName){
        if(!S.loginSearchDone){ await searchLoginDirectory(); }
        if(S.loginResults.length){ throw {message:'ابتدا پرونده متعلق به خودتان را از فهرست انتخاب کنید؛ اگر هیچ‌کدام شما نیستید، گزینه ثبت نام جدید را بزنید.'}; }
        throw {message:'ابتدا نتیجه جستجوی فهرست را بررسی و گزینه «نام من در فهرست نیست» را انتخاب کنید.'};
      }
      if(S.loginSelected){ f=S.loginSelected.first; l=S.loginSelected.last; }
      await sbAuth({email:CFG.familyEmail,password:enDigits($('#l_code').value).trim()},'password'); S.isAdmin=false;
      S.me={first:f,last:l}; lsSet('shj_me',JSON.stringify(S.me));
      if(S.loginSelected){ lsSet('shj_myid',JSON.stringify({k:nn(f)+'|'+famKey(l),id:S.loginSelected.id})); lsSet('shj_mynew',''); }
      else { lsSet('shj_myid',''); lsSet('shj_mynew',nn(f)+'|'+famKey(l)); }
    }
    S.authed=true; S.loginPending=null; S.loginErr=''; S.adminLogin=false; S.loginDraft={first:'',last:''}; S.loginSelected=null; S.loginResults=[]; S.loginNewName=false;
    if(!S.db) startData(); else startSubs();
    render();
  }catch(e){ const em=String((e&&e.message)||''); const net=(e instanceof TypeError)||/Failed to fetch|NetworkError|Load failed|network/i.test(em);
    S.loginErr=net?'ارتباط با سرور برقرار نشد. اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.':(e&&e.code===400)?'رمز یا ایمیل درست نیست. رمز را با کیبورد انگلیسی بنویسید.':((e&&e.message&&e.code!==undefined&&typeof e.code==='number')?'ورود انجام نشد. اینترنت را بررسی کنید':(e&&e.message)||'ورود انجام نشد'); render(); }
}

function registerSW(){
  try{ if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js?v=shj-v2').catch(()=>{}); }catch(e){}
}
async function boot(){ setTimeout(registerSW,600);
  if(lsGet('shj_login_flow_version')!==LOGIN_FLOW_VERSION){ lsSet('shj_sess',''); lsSet(SESSION_KEY,''); lsSet('shj_me',''); lsSet('shj_myid',''); lsSet('shj_mynew',''); kv.del('col:people'); kv.del('col:memories'); lsSet('shj_login_flow_version',LOGIN_FLOW_VERSION); }

  S.uid=lsGet('shj_uid')||(()=>{ const a=new Uint8Array(8); crypto.getRandomValues(a); const u='u'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(''); lsSet('shj_uid',u); return u; })();
  try{ S.mySub=JSON.parse(lsGet('shj_mysub')||'null'); }catch(e){}
  let ss=null; try{ ss=JSON.parse(lsGet(SESSION_KEY)||'null'); }catch(e){}
  if(ss&&ss.r){
    SB.refresh=ss.r; SB.email=ss.e||'';
    let c1=null,c2=null; try{ const a=await kv.get('col:people'), b=await kv.get('col:memories'); c1=a&&JSON.parse(a); c2=b&&JSON.parse(b); }catch(e){}
    if(c1&&c1.rows&&S.me){
      /* شروع فوری از اطلاعات ذخیره‌شده؛ به‌روزرسانی در پس‌زمینه */
      S.people=rowsToObj(c1.rows); S.memories=(c2&&c2.rows)?rowsToObj(c2.rows):{}; S.cacheSig={people:c1.sig,memories:c2&&c2.sig}; S.hadCache=true;
      S.authed=true; S.isAdmin=SB.email.toLowerCase()===CFG.adminEmail.toLowerCase(); S.ready=true; render();
      (async()=>{ for(let k=0;;k++){
        try{ await sbRefresh(); startData(); setOffline(false); return; }
        catch(e){ const c=e&&e.code; if(c===400||c===401||c===403){ lsSet(SESSION_KEY,''); SB.refresh=null; S.authed=false; S.hadCache=false; S.people={}; S.memories={}; kv.del('col:people'); kv.del('col:memories'); render(); return; }
          setOffline(true); await new Promise(r=>setTimeout(r,Math.min(60000,5000*(k+1)))); } } })();
      return;
    }
    try{ await sbRefresh(); S.authed=true; S.isAdmin=SB.email.toLowerCase()===CFG.adminEmail.toLowerCase(); }catch(e){ const c=e&&e.code; if(c===400||c===401||c===403) lsSet(SESSION_KEY,''); }
  }
  S.ready=true;
  if(S.authed) startData();
  render();
}

/* Homepage refinement: one compact visual language, portrait-led welcome */
.home-dashboard{gap:15px}
.home-hero-clean{min-height:205px;padding:25px clamp(18px,3vw,32px)}
.home-welcome-person{display:flex;align-items:center;gap:14px;margin-top:10px}
.home-welcome-person .av,.home-profile-fallback{width:76px;height:76px;min-width:76px;border-radius:22px;object-fit:cover;border:2px solid #ffffff9c;box-shadow:0 5px 18px #09251d45;font-size:28px}
.home-profile-fallback{display:grid;place-items:center;background:#ffffff20;color:#fff}
.home-welcome-person h2{margin:0 0 5px}
.home-welcome-person p{margin:0;max-width:520px}
.home-hero-clean .home-hero-copy{max-width:690px}
.home-hero-clean .home-hero-note{left:25px;bottom:20px}
.home-family-strip{display:flex;align-items:center;gap:18px;padding:12px 17px;background:var(--surface);border:1px solid var(--line);border-radius:15px}
.home-family-strip>div{display:grid;gap:2px}
.home-family-strip span{font-size:12px;color:var(--muted)}
.home-family-strip b{font-size:20px;color:var(--ink)}
.home-family-strip>i{height:30px;width:1px;background:var(--line)}
.home-family-strip .home-text-link{margin-right:auto}
.home-shortcuts-compact{grid-template-columns:repeat(3,minmax(0,1fr))}
.home-shortcuts-compact .home-shortcut{grid-template-columns:34px 1fr;align-items:center;column-gap:9px;padding:12px 14px}
.home-shortcuts-compact .home-shortcut>span{grid-row:span 2}
.home-shortcuts-compact .home-shortcut>small{grid-column:2}
.home-shortcuts-compact .home-shortcut>i{bottom:14px}
.home-more{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 15px}
.home-more>summary{padding:13px 2px;cursor:pointer;font-size:12px;font-weight:800;color:var(--primary)}
.home-more-content{display:grid;gap:12px;padding:0 0 14px}
@media(max-width:760px){
 .home-hero-clean{min-height:0;padding:20px 17px}
 .home-welcome-person .av,.home-profile-fallback{width:62px;height:62px;min-width:62px;border-radius:18px}
 .home-hero-clean .home-hero-note{display:none}
