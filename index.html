/* Layout: one calm column (max 1100px). Header with brand, pill nav, then one view at a time.
   Tree is shown as an illustrated tree (roots, trunk, branches), a clean org chart, or a collapsible outline. */
:root{
  --bg:#F1F5F3;          /* cool green-grey ground */
  --surface:#FFFFFF;     /* cards */
  --surface2:#E7EEEB;    /* quiet fills */
  --ink:#14302A;         /* cypress-black text */
  --muted:#5A726B;       /* secondary text */
  --line:#C5D3CE;        /* hairlines */
  --primary:#1E5B50;     /* cypress green */
  --on-primary:#FFFFFF;
  --accent:#B8791A;      /* saffron, used sparingly */
  --male:#3A7CA5;
  --female:#B0527A;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#B3392F;
  --font-display:'Aref Ruqaa','Vazirmatn',serif;
  --font-body:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A17; --surface:#16251F; --surface2:#1E322B; --ink:#E4EFEA; --muted:#93AEA5; --line:#2E463D;
    --primary:#58B8A3; --on-primary:#06201A; --accent:#E3AE4A; --male:#6FB0D6; --female:#E08BB0;
    --ok:#5CC283; --warn:#E3A14A; --bad:#EE7B70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A17; --surface:#16251F; --surface2:#1E322B; --ink:#E4EFEA; --muted:#93AEA5; --line:#2E463D;
  --primary:#58B8A3; --on-primary:#06201A; --accent:#E3AE4A; --male:#6FB0D6; --female:#E08BB0;
  --ok:#5CC283; --warn:#E3A14A; --bad:#EE7B70; color-scheme:dark;
}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.5}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
option[value="__new"]{font-weight:700;color:var(--accent)}
.rel>label.f>select{border-color:var(--accent)}

.crop-bg{position:fixed;inset:0;background:rgba(5,15,12,.75);z-index:80;display:flex;align-items:center;justify-content:center;padding:12px}
.crop-box{background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;width:min(360px,100%);max-height:100%;overflow:auto}
.crop-view{position:relative;width:300px;height:400px;max-width:100%;touch-action:none;cursor:grab;border-radius:8px;overflow:hidden;background:#222;user-select:none}
.crop-view canvas{width:100%;height:100%;display:block}

/* ---- Jalali calendar ---- */
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BRK=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let gy=jy+621,leapJ=-14,jp=BRK[0],jm,jump,leap,leapG,march,n,i;
  for(i=1;i<BRK.length;i++){jm=BRK[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm;}
  n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march};}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d;}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;}
const monthLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29);
const TODAY=(()=>{
  let y=1405,m=1,d=1;
  try{ const parts=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
    const g=t=>+(parts.find(p=>p.type===t)||{}).value; if(g('year')>1300&&g('month')&&g('day')){y=g('year');m=g('month');d=g('day');} }catch(e){}
  return {y,m,d,jdn:j2d(y,m,d)};
})();
const nowYear=TODAY.y;
function d2g(jdn){ let j=4*jdn+139361631; j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908; const i=div(mod(j,1461),4)*5+308; const gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1, gy=div(j,1461)-100100+div(8-gm,6); return {gy,gm,gd}; }
function turnAge(p){ if(!p.bY||!p.bM||!p.bD) return null; let ty=TODAY.y; if(j2d(ty,p.bM,Math.min(p.bD,monthLen(ty,p.bM)))<TODAY.jdn) ty++; return ty-p.bY; }
function daysToBirthday(m,d){ let y=TODAY.y, t=j2d(y,m,Math.min(d,monthLen(y,m))); if(t<TODAY.jdn){ y++; t=j2d(y,m,Math.min(d,monthLen(y,m))); } return t-TODAY.jdn; }
function dstr(y,m,d){ const a=[]; if(d&&m){a.push(fa(d),MONTHS[m-1]);} else if(m){a.push(MONTHS[m-1]);} if(y) a.push(fa(y)); return a.join(' '); }
const bd=p=>({y:p.bY||0,m:p.bM||0,d:p.bD||0});
function ageNow(p){
  if(!p.bY) return null;
  const endY=p.dead?(p.dY||0):TODAY.y, endM=p.dead?(p.dM||0):TODAY.m, endD=p.dead?(p.dD||0):TODAY.d;
  if(!endY) return null;
  let a=endY-p.bY; if(p.bM&&p.bD&&endM&&endD&&(endM<p.bM||(endM===p.bM&&endD<p.bD))) a--;
  return a>=0&&a<125?a:null;
}

/* ================= effective people (links by name) ================= */
function effective(){
  const R=S.people, P={}, virt=new Set();
  Object.keys(R).forEach(id=>P[id]=Object.assign({},R[id]));
  const byName={}; Object.keys(R).forEach(id=>{ const k=nn(full(R[id])); (byName[k]=byName[k]||[]).push(id); });
  const split=n=>{ const t=norm(n).replace(/\s+/g,' ').split(' '); return t.length>1?{first:t.slice(0,-1).join(' '),last:t[t.length-1]}:{first:t[0]||'',last:''}; };
  const ghost=(key,props)=>{ if(!P[key]){ P[key]=Object.assign({first:'',last:'',gender:'',bY:0,bM:0,bD:0,dead:false,virtual:true,fatherId:'',motherId:'',spouseId:'',spl:[],photo:''},props); virt.add(key); } else { const g=P[key]; if(!g.bY&&props.bY){g.bY=props.bY;g.bM=props.bM||0;g.bD=props.bD||0;} } return key; };
  function resolve(ref,gender,fromId){
    if(!ref||!nn(ref.name)) return '';
    const k=nn(ref.name), y=ref.y||0;
    let c=(byName[k]||[]).filter(i=>i!==fromId&&(!gender||R[i].gender===gender)&&(!y||!R[i].bY||R[i].bY===y));
    if(c.length>1&&y){ const e=c.filter(i=>R[i].bY===y); if(e.length===1) c=e; }
    if(c.length===1) return c[0];
    if(c.length>1) return '';
    const s=split(ref.name);
    return ghost('v_'+hash(k+'|'+(gender||'')+'|'+y),{first:s.first,last:s.last,gender:gender||'',bY:y,bM:ref.m||0,bD:ref.d||0});
  }
  const ids=Object.keys(R).sort();
  ids.forEach(id=>{
    const p=R[id], q=P[id], opp=p.gender==='m'?'f':p.gender==='f'?'m':'';
    q.fatherId=R[p.fatherId]?p.fatherId:resolve(p.fatherRef,'m',id);
    q.motherId=R[p.motherId]?p.motherId:resolve(p.motherRef,'f',id);
    q.spl=spListOf(p).map(x=>({id:R[x.id]?x.id:resolve(x.ref,opp,id),st:x.st||'current'})).filter(x=>x.id&&x.id!==id);
    q.spouseId=q.spl[0]?q.spl[0].id:'';
  });
  ids.forEach(id=>{
    String(R[id].kidNames||'').split(/\n|،|,/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
      const k=nn(line);
      const ex=Object.keys(P).some(c=>c!==id&&(P[c].fatherId===id||P[c].motherId===id)&&(nn(full(P[c]))===k||nn(P[c].first)===k));
      if(ex) return;
      const me=P[id], isF=me.gender==='f', sp=P[me.spouseId]?me.spouseId:'';
      const f=isF?(sp&&P[sp].gender!=='f'?sp:''):id, m=isF?id:(sp&&P[sp].gender!=='m'?sp:'');
      const s=split(line);
      const vid=ghost('v_'+hash('kid|'+k+'|'+f+'|'+m),{first:s.first,last:s.last||me.last||'',gender:'',fatherId:f,motherId:m});
      P[vid].fatherId=f; P[vid].motherId=m;
    });
  });
  return {P,virt};
}

/* ================= tree model ================= */
function buildTree(){
  if(S.T) return S.T;
  const E=effective(), P=E.P, ids=Object.keys(P);
  const has=id=>!!(id&&P[id]);
  const hasParents=id=>has(P[id].fatherId)||has(P[id].motherId);
  const partners={}; ids.forEach(i=>partners[i]=new Set());
  const link=(a,b)=>{ if(a&&b&&a!==b&&has(a)&&has(b)){partners[a].add(b);partners[b].add(a);} };
  ids.forEach(i=>{ const p=P[i]; (p.spl||[]).forEach(x=>link(i,x.id)); if(has(p.fatherId)&&has(p.motherId)) link(p.fatherId,p.motherId); });
  const pst={}; ids.forEach(i=>(P[i].spl||[]).forEach(x=>{ if(!has(x.id)) return; const k=[i,x.id].sort().join('|'); if(!pst[k]||pst[k]==='current') pst[k]=x.st||'current'; }));
  const FAMN=famKey('الله‌رضایی'), isFam=i=>famKey(P[i].last)===FAMN, famMode=ids.some(isFam);
  const marryIn={}; ids.forEach(i=>{
    const ps=[...partners[i]];
    marryIn[i]=famMode
      ? (!isFam(i)&&ps.some(isFam))||(isFam(i)&&!hasParents(i)&&ps.some(q=>isFam(q)&&hasParents(q)))
      : (!hasParents(i)&&ps.some(q=>hasParents(q)));
  });
  const placeOf=i=>{ const p=P[i], f=has(p.fatherId)&&!marryIn[p.fatherId]?p.fatherId:null, m=has(p.motherId)&&!marryIn[p.motherId]?p.motherId:null;
    if(f&&m) return (!hasParents(f)&&hasParents(m))?m:f;   // اگر پدر بی‌پدرومادر و مادر دارای والدین است، فرزند زیر شاخهٔ مادر می‌رود
    return f||m||null; };
  const kidsOf={}; ids.forEach(i=>{ const pl=placeOf(i); if(pl&&pl!==i) (kidsOf[pl]=kidsOf[pl]||[]).push(i); });
  const byBirth=(a,b)=>{ const ya=P[a].bY,yb=P[b].bY; if(ya&&yb&&ya!==yb) return ya-yb; if(ya&&!yb) return -1; if(!ya&&yb) return 1; return (P[a].first||'').localeCompare(P[b].first||'','fa'); };
  Object.values(kidsOf).forEach(a=>a.sort(byBirth));
  const cands=ids.filter(i=>!marryIn[i]&&(!placeOf(i)||placeOf(i)===i));
  cands.sort((a,b)=>(P[a].gender==='m'?0:1)-(P[b].gender==='m'?0:1)||byBirth(a,b));
  const used=new Set(), rootSpec=[];
  cands.forEach(r=>{ if(used.has(r)) return; used.add(r); const extra=[]; partners[r].forEach(q=>{ if(cands.includes(q)&&!used.has(q)){used.add(q);extra.push(q);} }); rootSpec.push({id:r,extra}); });
  const vis=new Set(), shown=new Set(), gen={}, inlaw=new Set(); let nodes=[];
  function mk(id,extra,depth){
    if(vis.has(id)) return null; vis.add(id); shown.add(id);
    const sp=new Set(extra||[]); partners[id].forEach(q=>sp.add(q)); sp.delete(id);
    const spouses=[...sp].filter(q=>P[q]); spouses.forEach(q=>{ shown.add(q); if(gen[q]==null) gen[q]=depth; });
    if(gen[id]==null) gen[id]=depth;
    const n={id,spouses,kids:[],depth,size:0,set:null}; nodes.push(n);
    n.kids=(kidsOf[id]||[]).map(c=>mk(c,null,depth+1)).filter(Boolean);
    const set=new Set([id,...spouses]); n.kids.forEach(k=>k.set.forEach(x=>set.add(x)));
    n.set=set; n.size=set.size; return n;
  }
  let roots=rootSpec.map(r=>mk(r.id,r.extra,1)).filter(Boolean);
  /* خانوادهٔ همسر (پدر و مادر و خواهر و برادر همسر) شاخهٔ جدا نمی‌سازد؛ درخت اصلی همان است که بزرگ‌تر است */
  if(roots.length>1){
    const lc={}; ids.forEach(i=>{ const k=famKey(P[i].last); if(k) lc[k]=(lc[k]||0)+1; });
    const FAM=famKey('الله‌رضایی'), topLast=lc[FAM]?FAM:(Object.keys(lc).sort((x,y)=>lc[y]-lc[x])[0]||'');
    const score=n=>{ let c=0,t=0; const w=m=>{ t++; if(famKey(P[m.id].last)===topLast) c++; m.kids.forEach(w); }; w(n); return c*1000+t; };
    const main=roots.reduce((a,b)=>score(b)>score(a)?b:a,roots[0]), drop=new Set();
    roots.forEach(r=>{ if(r!==main&&[...r.set].some(x=>main.set.has(x))) drop.add(r); });
    if(drop.size){
      const gone=new Set(), walk=n=>{ gone.add(n); n.kids.forEach(walk); }; drop.forEach(walk);
      nodes=nodes.filter(n=>!gone.has(n));
      drop.forEach(r=>r.set.forEach(x=>{ if(!main.set.has(x)){ shown.delete(x); inlaw.add(x); } }));
      roots=roots.filter(r=>!drop.has(r));
    }
  }
  const unplaced=ids.filter(i=>!shown.has(i)).sort(byBirth), lost=unplaced.filter(i=>!inlaw.has(i));
  const couples=new Set(); ids.forEach(i=>partners[i].forEach(q=>couples.add([i,q].sort().join('|'))));
  S.T={P,virt:E.virt,roots,nodes,unplaced,lost,gen,couples:couples.size,pst};
  return S.T;
}
const EP=()=>buildTree().P;

}

/* برچسب کوتاه برای تشخیص افراد هم‌نام: «پسر رضا»، «دختر مریم (مادر)» یا «همسر علی» */
function kinTag(id,p){
  const E=EP(), q=E[id]||p||{}, fn=x=>(x&&E[x])?(E[x].first||''):'', rn=r=>r&&r.name?String(r.name).trim().split(/\s+/)[0]:'';
  const kid=q.gender==='f'?'دختر':q.gender==='m'?'پسر':'فرزند';
  const f=fn(q.fatherId)||rn(q.fatherRef), m=fn(q.motherId)||rn(q.motherRef);
  if(f) return kid+' '+f;
  if(m) return kid+' '+m+' (مادر)';
  let sid=(q.spl&&q.spl[0]&&q.spl[0].id)||(q.spouseId&&E[q.spouseId]?q.spouseId:'');
  if(!sid){ sid=Object.keys(E).find(x=>x!==id&&(E[x].spl||[]).some(y=>y.id===id))||''; }
  if(sid&&E[sid]){ const sf=fn(E[sid].fatherId); return 'همسر '+(E[sid].first||'')+(sf?' ('+(E[sid].gender==='f'?'دختر ':'پسر ')+sf+')':''); }
  const sn=rn(q.spouseRef); return sn?'همسر '+sn:'';
}
function pickLabel(id,rec){
  const p=rec.p; let s=full(p);
  if(p.bY) s+=' ('+fa(p.bY)+')';
  const t=kinTag(id,p); if(t) s+=' – '+t;
  if(rec.pending) s+=' ⏳';
  return s;
}

function icsBirthdays(){

  const fmt=j=>{ const g=d2g(j); return g.gy+pad(g.gm)+pad(g.gd); };
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shajare Allahrezaei//FA','CALSCALE:GREGORIAN','X-WR-CALNAME:'+esc2('تولدهای خاندان الله‌رضایی')];

function completeInfo(){
  const T=buildTree(), P=T.P, depth={}, out={}; T.nodes.forEach(n=>{ depth[n.id]=n.depth; });
  Object.entries(P).forEach(([id,p])=>{ if(p.virtual) return;
    const it=[], add=(k,l,w,ok)=>it.push({k,l,w,ok});
    add('birth','سال تولد',20,!!p.bY); add('date','روز و ماه تولد',8,!!(p.bM&&p.bD)); add('photo','عکس',15,!!p.photo);
    if((depth[id]||0)>1) add('parents','پدر یا مادر',20,!!(p.fatherId||p.motherId));
    if(p.dead) add('death','سال درگذشت',10,!!p.dY); else { add('place','محل سکونت یا تولد',10,!!(p.residence||p.birthPlace||p.place)); add('job','شغل',5,!!p.job); }
    add('story','سرگذشت',15,!!p.story); add('legacy','جمله برای نسل‌های آینده',5,!!p.legacy);
    const tot=it.reduce((a,x)=>a+x.w,0), got=it.reduce((a,x)=>a+(x.ok?x.w:0),0);
    out[id]={pct:Math.round(got/tot*100),missing:it.filter(x=>!x.ok)}; });
  return out;
}

function ezafe(w){ const c=String(w).trim().slice(-1); return c==='ه'?'ٔ':(c==='ا'||c==='و')?'ی':''; }
function relGraph(){
  const T=buildTree(), P=T.P, ids=Object.keys(P), up={}, down={}, sp={};
  ids.forEach(i=>{ up[i]=[]; down[i]=[]; sp[i]=new Set(); });
  ids.forEach(i=>{ const p=P[i];
    [p.fatherId,p.motherId].forEach(q=>{ if(q&&P[q]&&q!==i&&!up[i].includes(q)){ up[i].push(q); down[q].push(i); } });
    (p.spl||[]).forEach(x=>{ if(P[x.id]&&x.id!==i){ sp[i].add(x.id); sp[x.id].add(i); } });
    if(P[p.fatherId]&&P[p.motherId]){ sp[p.fatherId].add(p.motherId); sp[p.motherId].add(p.fatherId); } });
  return {P,ids,up,down,sp,T};
}
function relPath(g,a,b){
  const {up,down,sp}=g; if(a===b) return null;
  const anc=s=>{ const d={[s]:0}, pr={}; let fr=[s]; while(fr.length){ const nx=[]; fr.forEach(x=>up[x].forEach(q=>{ if(d[q]==null){ d[q]=d[x]+1; pr[q]=x; nx.push(q); } })); fr=nx; } return {d,pr}; };
  const A=anc(a), B=anc(b); let best=null;
  Object.keys(A.d).forEach(c=>{ if(B.d[c]!=null){ const L=A.d[c]+B.d[c]; if(!best||L<best.L) best={c,L}; } });
  let blood=null;
  if(best){ const ca=[best.c]; let x=best.c; while(x!==a){ x=A.pr[x]; ca.push(x); } const cb=[best.c]; x=best.c; while(x!==b){ x=B.pr[x]; cb.push(x); } blood=ca.reverse().concat(cb.slice(1)); }
  const prev={[a]:null}; let fr=[a], full=null;
  while(fr.length&&!full){ const nx=[]; for(const x of fr){ for(const y of [...up[x],...down[x],...sp[x]]){ if(y in prev) continue; prev[y]=x; if(y===b){ full=[b]; let z=b; while(prev[z]!==null){ z=prev[z]; full.push(z); } full.reverse(); break; } nx.push(y); } if(full) break; } fr=nx; }
  if(blood&&(!full||blood.length<=full.length)) return blood;
  return full||blood;
}
function relName(g,nodes){
  const {P,up,down,T}=g, A=P[nodes[0]], B=P[nodes[nodes.length-1]], bm=B.gender==='m', bf=B.gender==='f', am=A.gender==='m', af=A.gender==='f';
  const gn=i=>P[nodes[i]].gender;
  let s=''; for(let i=0;i<nodes.length-1;i++){ const x=nodes[i], y=nodes[i+1]; s+=up[x].includes(y)?'U':down[x].includes(y)?'D':'S'; }
  const pick=(m,f)=>bm?m:bf?f:m+' / '+f;
  const half=()=>{ const sf=A.fatherId&&A.fatherId===B.fatherId, sm=A.motherId&&A.motherId===B.motherId; const df=A.fatherId&&B.fatherId&&A.fatherId!==B.fatherId, dm=A.motherId&&B.motherId&&A.motherId!==B.motherId; return (sf||sm)&&(df||dm); };
  const wife=(m,f)=>am?m:af?f:null;
  let r=null;
  if(s==='U') r=pick('پدر','مادر');
  else if(s==='UU') r=pick('پدربزرگ','مادربزرگ')+(gn(1)==='m'?' پدری':' مادری');
  else if(/^U{3,}$/.test(s)) r=pick('جد','جده')+' ('+fa(s.length)+' نسل بالاتر)';
  else if(s==='D') r=pick('پسر','دختر');
  else if(s==='DD') r='نوهٔ '+(gn(1)==='m'?'پسری':'دختری');
  else if(s==='DDD') r='نتیجه'; else if(s==='DDDD') r='نبیره';
  else if(/^D{5,}$/.test(s)) r='نوادهٔ '+fa(s.length)+' نسل پایین‌تر';
  else if(s==='UD') r=pick('برادر','خواهر')+(half()?' ناتنی':'');
  else if(s==='UUD') r=gn(1)==='m'?(bm?'عمو':'عمه'):(bm?'دایی':'خاله');
  else if(s==='UUDD'){ const t=gn(1)==='m'?(gn(3)==='m'?'عمو':'عمه'):(gn(3)==='m'?'دایی':'خاله'); r=(bm?'پسر':'دختر')+t; }

  else if(s==='SUD') r=am?(bm?'برادرزن':'خواهرزن'):af?(bm?'برادرشوهر':'خواهرشوهر'):(bm?'برادرِ همسر':'خواهرِ همسر');
  else if(s==='SUDD') r=(gn(3)==='m'?'برادرزادهٔ':'خواهرزادهٔ')+' همسر';
  else if(s==='SUU') r=(bm?'پدربزرگِ':'مادربزرگِ')+' همسر';
  else if(s==='SD') r=(bm?'پسرِ':'دخترِ')+(af?' شوهر':' همسر');
  else if(s==='DS') r=(bf&&gn(1)==='m')?'عروس':(bm&&gn(1)==='f')?'داماد':'همسرِ فرزند';
  else if(s==='UDS') r=(gn(2)==='m'&&bf)?'زن‌برادر':(gn(2)==='f'&&bm)?'شوهرخواهر':'همسرِ '+(gn(2)==='m'?'برادر':'خواهر');
  else if(s==='SUDS'&&am&&bm) r='باجناق (هم‌زلف)';
  else if(s==='SUDS'&&af&&bf) r='جاری';
  if(!r){
    const noun=(i)=>{ const st=s[i], y=P[nodes[i+1]].gender; return st==='U'?(y==='m'?'پدر':'مادر'):st==='D'?(y==='m'?'پسر':'دختر'):(y==='m'?'شوهر':'همسر'); };
    r=nodes.slice(1).map((_,i)=>noun(i)).reverse().join('ِ ');
  }
  return r;
}

function computeStats(){
  const T=buildTree(), P=T.P, all=Object.values(P), real=Object.values(S.people);
  const m=all.filter(p=>p.gender==='m').length, f=all.filter(p=>p.gender==='f').length;
  const dead=all.filter(p=>p.dead).length;
  const gens={}; Object.entries(T.gen).forEach(([id,g])=>{ if(P[id]) gens[g]=(gens[g]||0)+1; });
  const fams=T.nodes.filter(n=>n.kids.length||n.spouses.length).map(n=>{
    const ks=n.kids.map(k=>P[k.id]);
    return {n,id:n.id,set:n.set,kidIds:n.kids.map(k=>k.id),title:full(P[n.id])+(n.spouses.length?' و '+n.spouses.map(q=>P[q].first||'').join(' و '):''),
      kids:ks.length,sons:ks.filter(p=>p.gender==='m').length,daus:ks.filter(p=>p.gender==='f').length,size:n.size,depth:n.depth};
  });
  const withKids=fams.filter(x=>x.kids);
  const living=real.filter(p=>!p.dead&&p.bY);
  const age=p=>ageNow(p);
  const groups=[['تا ۱۷ سال',0,17],['۱۸ تا ۳۴',18,34],['۳۵ تا ۴۹',35,49],['۵۰ تا ۶۴',50,64],['۶۵ به بالا',65,200]].map(([l,a,b])=>({l,c:living.filter(p=>{const x=age(p);return x!=null&&x>=a&&x<=b;}).length}));
  const byAge=living.filter(p=>age(p)!=null).sort((a,b)=>age(b)-age(a));
  const lifespans=real.filter(p=>p.dead&&p.bY&&p.dY&&p.dY>=p.bY).map(p=>p.dY-p.bY);
  const months=Array(12).fill(0); real.forEach(p=>{ if(p.bM) months[p.bM-1]++; });
  const top=k=>{ const c={}; real.forEach(p=>{ const v=nn(typeof k==='function'?k(p):p[k]); if(v) c[v]=(c[v]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5); };
  const pc=f=>real.length?Math.round(real.filter(f).length/real.length*100):0;
  const memCount={}; Object.values(S.memories).forEach(x=>{ memCount[x.personId]=(memCount[x.personId]||0)+1; });
  const mostMem=Object.entries(memCount).filter(([id])=>P[id]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {total:all.length,m,f,dead,alive:all.length-dead,gens,fams,famCount:withKids.length,
    avg:withKids.length?withKids.reduce((s,x)=>s+x.kids,0)/withKids.length:0,mem:Object.keys(S.memories).length,
    virt:T.virt.size,couples:T.couples,groups,oldest:byAge[0],youngest:byAge[byAge.length-1],
    lifespan:lifespans.length?lifespans.reduce((a,b)=>a+b,0)/lifespans.length:0,months,places:top(p=>p.residence||p.birthPlace||p.place),jobs:top('job'),
    comp:{birth:pc(p=>p.bY),date:pc(p=>p.bY&&p.bM&&p.bD),photo:pc(p=>p.photo),parents:pc(p=>p.fatherId||p.motherId||(p.fatherRef&&p.fatherRef.name)||(p.motherRef&&p.motherRef.name))},
    mostMem,realCount:real.length};
}

function opts(filter,sel,self,withNew,q){
  const nq=q?nn(q):'';
  const arr=Object.entries(pendingItems()).filter(([id,r])=>id!==self&&(!filter||filter(r.p))&&(!nq||id===sel||nn(pickLabel(id,r)).includes(nq))).sort((a,b)=>full(a[1].p).localeCompare(full(b[1].p),'fa'));
  return (withNew?`<option value="__new" ${sel==='__new'?'selected':''}>✍️ در فهرست نیست؛ نامش را می‌نویسم</option>`:'')+`<option value="" ${sel?'':'selected'}>— نامشخص —</option>`+arr.map(([id,r])=>`<option value="${esc(id)}" ${id===sel?'selected':''}>${esc(pickLabel(id,r))}</option>`).join('')+((nq&&!arr.length)?'<option value="" disabled>نتیجه‌ای پیدا نشد؛ گزینهٔ «در فهرست نیست» را بزنید</option>':'');

function yearOpts(sel){
  const hi=Math.max(nowYear,sel||0), lo=Math.min(1250,sel||1250); let o='';
  for(let y=hi;y>=lo;y--) o+=`<option value="${y}" ${sel===y?'selected':''}>${fa(y)}</option>`;
  return o;
}
function dateW(p,v){
  v=v||{};
  return `<div class="dw"><select id="${p}_d" aria-label="روز"><option value="">روز</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${v.d===i+1?'selected':''}>${fa(i+1)}</option>`).join('')}</select>
  <select id="${p}_m" aria-label="ماه"><option value="">ماه</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${v.m===i+1?'selected':''}>${n}</option>`).join('')}</select>
  <select id="${p}_y" aria-label="سال"><option value="">سال</option>${yearOpts(v.y)}</select></div>`;
}
function readDate(p){
  let y=parseInt(norm($('#'+p+'_y').value),10)||0, m=parseInt($('#'+p+'_m').value,10)||0, d=parseInt($('#'+p+'_d').value,10)||0;
  if(y&&(y<1200||y>nowYear)) y=0;

  return {y,m,d};
}

function gedcomExport(){
  const T=buildTree(), P=T.P, ids=Object.keys(P), idx={}; ids.forEach((i,k)=>{ idx[i]=k+1; });
  const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const gd=(y,m,d)=>{ if(!y) return ''; if(m&&d){ const g=d2g(j2d(y,m,Math.min(d,monthLen(y,m)))); return g.gd+' '+MON[g.gm-1]+' '+g.gy; } return 'ABT '+(y+621); };
  const fams={}, famOf=(a,b)=>{ const key=[a||'',b||''].sort().join('|'); return fams[key]||(fams[key]={mem:[a,b].filter(Boolean),kids:[],id:0}); };
  ids.forEach(i=>(P[i].spl||[]).forEach(x=>{ if(P[x.id]&&x.id!==i) famOf(i,x.id); }));
  ids.forEach(i=>{ const p=P[i], f=P[p.fatherId]?p.fatherId:'', m=P[p.motherId]?p.motherId:''; if(f||m){ const F=famOf(f,m); if(!F.kids.includes(i)) F.kids.push(i); } });
  const fl=Object.values(fams); fl.forEach((F,k)=>{ F.id=k+1; });
  const famsOf={}, famc={}; fl.forEach(F=>{ F.mem.forEach(m=>{ (famsOf[m]=famsOf[m]||[]).push(F.id); }); F.kids.forEach(k=>{ famc[k]=F.id; }); });
  const L=['0 HEAD','1 SOUR SHAJARE','2 NAME Shajare Allahrezaei','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 LANG Persian'];
  ids.forEach(i=>{ const p=P[i]; L.push('0 @I'+idx[i]+'@ INDI','1 NAME '+(p.first||'')+' /'+(p.last||'')+'/','1 SEX '+(p.gender==='m'?'M':p.gender==='f'?'F':'U'));
    if(p.bY){ L.push('1 BIRT','2 DATE '+gd(p.bY,p.bM,p.bD)); if(p.birthPlace||p.place) L.push('2 PLAC '+(p.birthPlace||p.place)); }
    else if(p.birthPlace||p.place) L.push('1 BIRT','2 PLAC '+(p.birthPlace||p.place));
    if(p.dead){ L.push('1 DEAT Y'); if(p.dY) L.push('2 DATE '+gd(p.dY,p.dM,p.dD)); }
    if(p.residence) L.push('1 RESI','2 PLAC '+p.residence);
    if(p.job) L.push('1 OCCU '+p.job);
    if(p.note) L.push('1 NOTE '+String(p.note).replace(/\s+/g,' '));
    if(p.story) L.push('1 NOTE '+String(p.story).replace(/\s+/g,' ').slice(0,1500));
    if(p.legacy) L.push('1 NOTE پیام برای نسل‌های آینده: '+String(p.legacy).replace(/\s+/g,' '));
    if(famc[i]) L.push('1 FAMC @F'+famc[i]+'@');
    (famsOf[i]||[]).forEach(f=>L.push('1 FAMS @F'+f+'@')); });
  fl.forEach(F=>{ L.push('0 @F'+F.id+'@ FAM'); const mem=F.mem.slice().sort((a,b)=>(P[a].gender==='m'?0:1)-(P[b].gender==='m'?0:1));
    if(mem[0]) L.push('1 HUSB @I'+idx[mem[0]]+'@'); if(mem[1]) L.push('1 WIFE @I'+idx[mem[1]]+'@'); F.kids.forEach(k=>L.push('1 CHIL @I'+idx[k]+'@')); });
  L.push('0 TRLR'); return '\uFEFF'+L.join('\r\n')+'\r\n';
}

function drawArt(T,imgs){
  const P=T.P, R=46, GAP=280, CW=2*R+46, MARGIN=140, TRUNK=230, ROOTS=150, TOP=330;
  const HUES=[152,205,338,32,268,178,8,96,300,50];
  let maxD=1; T.nodes.forEach(n=>{ if(n.depth>maxD) maxD=n.depth; });
  /* هر شاخهٔ اصلی (فرزندان ریشه) یک رنگ می‌گیرد و نوه‌ها همان رنگ را به ارث می‌برند */
  let bi=0; const brs=[];
  const assign=(n,ci)=>{ n.ci=ci; n.kids.forEach(k=>assign(k,ci)); };
  T.roots.forEach(r=>{ r.ci=-1; r.kids.forEach(k=>{ brs.push({k,ci:bi}); assign(k,bi); bi++; }); });
  const hue=ci=>(HUES[ci%HUES.length]+Math.floor(ci/HUES.length)*14)%360;
  const bcol=(n,dl)=>{ if(n.ci<0) return '#8a6240'; const l=Math.min(54,36+Math.max(0,n.depth-2)*4)+(dl||0); return `hsl(${hue(n.ci)},58%,${l}%)`; };
  const lay=n=>{ n.cw=(1+n.spouses.length)*CW; n.kids.forEach(lay); n.kw=n.kids.reduce((s,k)=>s+k.aw,0); n.aw=Math.max(n.kw,n.cw+40); };
  T.roots.forEach(lay);
  const put=(n,left)=>{ n.cx=left+n.aw/2; let xr=left+n.aw-(n.aw-n.kw)/2; n.kids.forEach(k=>{ put(k,xr-k.aw); xr-=k.aw; }); };
  const content=T.roots.reduce((s,r)=>s+r.aw,0)+80*(T.roots.length-1);
  const W=Math.max(1500,content+MARGIN*2);
  let xr=W-(W-content)/2; T.roots.forEach(r=>{ put(r,xr-r.aw); xr-=r.aw+80; });
  const cyOf=n=>TOP+(maxD-n.depth)*GAP+R+34;
  const LEG=brs.length?110:0;
  const groundY=TOP+(maxD-1)*GAP+R+34+TRUNK, H=groundY+ROOTS+120+LEG;
  const sc=Math.min(1,7000/Math.max(W,H),Math.sqrt(40e6/(W*H)));
  const cv=document.createElement('canvas'); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc);
  const c=cv.getContext('2d'); c.scale(sc,sc); c.direction='rtl'; c.textAlign='center'; c.textBaseline='middle';
  let seed=1337; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const BARK1='#5b3d26', BARK2='#8a6240';
  const rr=(x,y,w,h,r)=>{ c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h); };
  // background
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#fffdf6'); g.addColorStop(.55,'#f1f7f1'); g.addColorStop(1,'#dcebe0'); c.fillStyle=g; c.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){ const x=rnd()*W, y=120+rnd()*(groundY-200), r=40+rnd()*110, hh=HUES[Math.floor(rnd()*HUES.length)]; const rg=c.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,`hsla(${hh},70%,68%,.11)`); rg.addColorStop(1,`hsla(${hh},70%,68%,0)`); c.fillStyle=rg; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); }
  // ground
  c.fillStyle='#cfe3d3'; c.beginPath(); c.moveTo(0,groundY); c.bezierCurveTo(W*.25,groundY-38,W*.5,groundY+14,W*.75,groundY-26); c.bezierCurveTo(W*.88,groundY-40,W*.95,groundY-8,W,groundY-18); c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();
  c.fillStyle='#b9d6bf'; c.beginPath(); c.moveTo(0,groundY+34); c.bezierCurveTo(W*.3,groundY+8,W*.6,groundY+56,W,groundY+18); c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();
  c.lineCap='round'; for(let x=20;x<W-20;x+=13){ const gy=groundY+Math.sin(x/190)*10+8; c.strokeStyle=rnd()<.5?'#86bb92':'#a3cfae'; c.lineWidth=3; c.beginPath(); c.moveTo(x,gy+10); c.lineTo(x+(rnd()-.5)*10,gy-8-rnd()*16); c.stroke(); }
  const bw=n=>Math.min(80,10+Math.sqrt(n.size)*5.5);
  // tinted canopy glow
  T.nodes.forEach(n=>{ if(n.ci>=0&&n.depth>=2){ const y=cyOf(n), hh=hue(n.ci); const rg=c.createRadialGradient(n.cx,y,10,n.cx,y,GAP*.95); rg.addColorStop(0,`hsla(${hh},65%,60%,.20)`); rg.addColorStop(1,`hsla(${hh},65%,60%,0)`); c.fillStyle=rg; c.beginPath(); c.arc(n.cx,y,GAP*.95,0,7); c.fill(); } });
  // roots and trunks
  T.roots.forEach(r=>{
    const w=bw(r), y1=cyOf(r), x=r.cx;
    for(let i=0;i<7;i++){ const dir=i%2?1:-1, k=(i+1)/7, ex=x+dir*(60+rnd()*220)*(.6+k), ey=groundY+ROOTS*(.55+rnd()*.5);
      c.strokeStyle=BARK1; c.lineCap='round'; c.lineWidth=Math.max(3,w*(.55-k*.35)); c.beginPath(); c.moveTo(x+dir*w*.3,groundY-6); c.bezierCurveTo(x+dir*w*1.1,groundY+ROOTS*.25,ex-dir*60,groundY+ROOTS*.4,ex,ey); c.stroke(); }
    const lg=c.createLinearGradient(x-w,0,x+w,0); lg.addColorStop(0,BARK1); lg.addColorStop(.5,BARK2); lg.addColorStop(1,BARK1);
    c.fillStyle=lg; c.beginPath(); c.moveTo(x-w/2,y1); c.bezierCurveTo(x-w/2,y1+TRUNK*.5,x-w*.95,groundY-TRUNK*.25,x-w*1.05,groundY+8); c.lineTo(x+w*1.05,groundY+8); c.bezierCurveTo(x+w*.95,groundY-TRUNK*.25,x+w/2,y1+TRUNK*.5,x+w/2,y1); c.closePath(); c.fill();
    c.strokeStyle='rgba(40,25,12,.28)'; c.lineWidth=2; for(let i=-1;i<=1;i++){ c.beginPath(); c.moveTo(x+i*w*.22,y1+20); c.bezierCurveTo(x+i*w*.3,y1+TRUNK*.4,x+i*w*.4,groundY-TRUNK*.3,x+i*w*.5,groundY); c.stroke(); }
  });
  // branches: tapered, coloured per lineage
  const leaves=[], bez=(t,a,b,cc,d)=>{ const u=1-t; return u*u*u*a+3*u*u*t*b+3*u*t*t*cc+t*t*t*d; };
  const taper=(x1,y1,x2,y2,x3,y3,x4,y4,w0,w1,fill,edge,alpha)=>{
    const N=30, A=[], B=[];
    for(let i=0;i<=N;i++){ const t=i/N, x=bez(t,x1,x2,x3,x4), y=bez(t,y1,y2,y3,y4), ta=Math.max(0,t-.015), tb=Math.min(1,t+.015);
      let dx=bez(tb,x1,x2,x3,x4)-bez(ta,x1,x2,x3,x4), dy=bez(tb,y1,y2,y3,y4)-bez(ta,y1,y2,y3,y4); const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      const w=(w0+(w1-w0)*t)/2; A.push([x-dy*w,y+dx*w]); B.push([x+dy*w,y-dx*w]); }
    c.save(); c.globalAlpha=alpha==null?1:alpha; c.beginPath(); A.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); for(let i=N;i>=0;i--) c.lineTo(B[i][0],B[i][1]); c.closePath();
    c.fillStyle=fill; c.fill(); if(edge){ c.strokeStyle=edge; c.lineWidth=1.6; c.lineJoin='round'; c.stroke(); } c.restore();
  };
  const branch=n=>{ const px=n.cx, py=cyOf(n);
    n.kids.forEach(k=>{ const kx=k.cx, ky=cyOf(k), w=bw(k);
      const x1=px, y1=py, x2=px, y2=py-GAP*.5, x3=kx, y3=ky+GAP*.5, x4=kx, y4=ky;
      taper(x1,y1,x2,y2,x3,y3,x4,y4,w*1.15,w*.6,bcol(k,-4),bcol(k,-14),1);
      taper(x1-w*.12,y1,x2-w*.12,y2,x3-w*.12,y3,x4-w*.12,y4,w*.36,w*.16,bcol(k,18),null,.5);
      const cnt=9+Math.round(Math.sqrt(k.size)*3); for(let i=0;i<cnt;i++){ const t=.12+rnd()*.78; leaves.push({x:bez(t,x1,x2,x3,x4)+(rnd()-.5)*w*1.4,y:bez(t,y1,y2,y3,y4)+(rnd()-.5)*w*1.4,ci:k.ci}); }
      branch(k); }); };
  T.roots.forEach(branch);
  // leaves and blossoms in the branch colour family
  const leaf=(x,y,ang,s,col)=>{ c.save(); c.translate(x,y); c.rotate(ang); c.fillStyle=col; c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(s*.6,-s*.55,s*1.7,0); c.quadraticCurveTo(s*.6,s*.55,0,0); c.fill(); c.restore(); };
  leaves.forEach(l=>{ const hh=hue(l.ci);
    for(let i=0;i<3;i++){ leaf(l.x,l.y,rnd()*6.28,11+rnd()*11,rnd()<.06?'#d9a441':`hsl(${hh+(rnd()-.5)*28},${52+rnd()*22}%,${38+rnd()*26}%)`); }
    if(rnd()<.2){ const bx=l.x+(rnd()-.5)*24, by=l.y+(rnd()-.5)*24; c.fillStyle=`hsla(${hh},85%,84%,.92)`; for(let j=0;j<5;j++){ const a=j*1.2566; c.beginPath(); c.arc(bx+Math.cos(a)*5,by+Math.sin(a)*5,4.2,0,7); c.fill(); } c.fillStyle='#e8b33f'; c.beginPath(); c.arc(bx,by,2.8,0,7); c.fill(); }
  });
  // fallen petals on the ground
  for(let i=0;i<60;i++){ const x=rnd()*W, y=groundY+10+rnd()*(ROOTS+40), hh=HUES[Math.floor(rnd()*HUES.length)]; leaf(x,y,rnd()*6.28,8+rnd()*7,`hsla(${hh},60%,62%,.7)`); }
  // people
  const fit=(txt,maxW,size,weight)=>{ let s=size; c.font=`${weight} ${s}px Vazirmatn, Tahoma, sans-serif`; while(c.measureText(txt).width>maxW&&s>10){ s--; c.font=`${weight} ${s}px Vazirmatn, Tahoma, sans-serif`; } };
  const hits=[];
  const person=(id,x,y,sp,node)=>{
    const p=P[id]; if(!p) return;
    const gcol=p.gender==='m'?'#3A7CA5':p.gender==='f'?'#B0527A':'#7a8a85', ring=bcol(node,0);
    c.save(); c.shadowColor='rgba(0,0,0,.28)'; c.shadowBlur=14; c.shadowOffsetY=5; c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,R+7,0,7); c.fill(); c.restore();
    c.save(); c.beginPath(); c.arc(x,y,R,0,7); c.clip();
    const im=imgs[id];
    if(im){ const sz=Math.max(2*R/im.width,2*R/im.height); const w=im.width*sz,h=im.height*sz; if(p.dead){ try{ c.filter='grayscale(1)'; }catch(e){} } c.drawImage(im,x-w/2,y-R-(h-2*R)*.18,w,h); }
    else { c.fillStyle=gcol+'33'; c.fillRect(x-R,y-R,2*R,2*R); c.fillStyle=gcol; c.font='700 40px Vazirmatn, Tahoma, sans-serif'; c.fillText((p.first||'؟').trim()[0]||'؟',x,y+2); }
    c.restore();
    c.strokeStyle=ring; c.lineWidth=6; c.setLineDash(p.virtual?[7,6]:[]); c.beginPath(); c.arc(x,y,R+3,0,7); c.stroke(); c.setLineDash([]);
    c.fillStyle=gcol; c.strokeStyle='#fff'; c.lineWidth=3; c.beginPath(); c.arc(x+R*.78,y+R*.78,10,0,7); c.fill(); c.stroke();
    const nm=full(p), ly=y+R+28; fit(nm,CW-22,17,700); const tw=Math.min(c.measureText(nm).width+24,CW-4);
    const yl=lifeLine(p), kin=sp?kinLine(id):'', ph=(yl?48:30)+(kin?18:0), pw=Math.max(tw,yl?90:0,kin?Math.min(c.measureText(kin).width*.8+24,CW-4):0);
    const hw=Math.max(R+7,pw/2); hits.push({id,x1:x-hw,x2:x+hw,y1:y-R-7,y2:ly-15+ph});
    c.save(); c.shadowColor='rgba(0,0,0,.12)'; c.shadowBlur=8; c.shadowOffsetY=2; c.fillStyle='rgba(255,255,255,.97)'; rr(x-pw/2,ly-15,pw,ph,12); c.fill(); c.restore();
    c.strokeStyle=ring; c.lineWidth=2.2; rr(x-pw/2,ly-15,pw,ph,12); c.stroke();
    c.fillStyle=p.dead?'#5A726B':'#14302A'; fit(nm,CW-22,17,700); c.fillText(nm,x,ly+1);
    if(yl){ c.font='400 13px Vazirmatn, Tahoma, sans-serif'; c.fillStyle='#5A726B'; c.fillText(yl,x,ly+23); }
    if(kin){ c.font='400 12px Vazirmatn, Tahoma, sans-serif'; c.fillStyle='#8a5a1f'; c.fillText(kin,x,ly+(yl?41:23),CW-16); }
  };
  const drawNodes=n=>{ const y=cyOf(n), ids=[n.id,...n.spouses], total=ids.length*CW; let x=n.cx+total/2-CW/2;
    ids.forEach((id,i)=>{ person(id,x,y,i>0,n); if(i<ids.length-1){ const bg=stBadge(n.id,ids[i+1],ids[i+1]); c.save(); c.strokeStyle=bg?'#b4543a':'#d9a441'; c.lineWidth=4; if(bg) c.setLineDash([6,5]); c.beginPath(); c.arc(x-CW/2,y,8,0,7); c.stroke(); if(bg){ c.setLineDash([]); c.fillStyle='#b4543a'; c.textAlign='center'; c.font='700 14px Vazirmatn, Tahoma, sans-serif'; c.fillText(bg,x-CW/2,y-16); } c.restore(); } x-=CW; });
    n.kids.forEach(drawNodes); };
  T.roots.forEach(drawNodes);
  // title with ornament
  c.fillStyle='#1E5B50'; c.font='700 74px "Aref Ruqaa", Vazirmatn, serif'; c.fillText(T.focusTitle||'شجره‌نامه خاندان الله‌رضایی',W/2,118);
  c.fillStyle='#5A726B'; c.font='400 26px Vazirmatn, Tahoma, sans-serif'; c.fillText(`${fa(T.focusCount||Object.keys(P).length)} نفر، ${fa(maxD)} نسل، ${dstr(TODAY.y,TODAY.m,TODAY.d)}`,W/2,198);
  c.strokeStyle='#d9a441'; c.lineWidth=3; c.beginPath(); c.moveTo(W/2-190,242); c.lineTo(W/2-18,242); c.moveTo(W/2+18,242); c.lineTo(W/2+190,242); c.stroke();
  c.fillStyle='#d9a441'; c.save(); c.translate(W/2,242); c.rotate(Math.PI/4); c.fillRect(-7,-7,14,14); c.restore();
  // legend: one dot per main branch
  if(brs.length){
    c.font='600 22px Vazirmatn, Tahoma, sans-serif'; let lx=W-140; const ly=H-72;
    for(const b of brs){ const t='شاخهٔ '+full(P[b.k.id]), tw=c.measureText(t).width, wid=tw+46; if(lx-wid<140){ c.fillStyle='#5A726B'; c.fillText('…',lx-10,ly); break; }
      c.fillStyle=bcol(b.k,0); c.beginPath(); c.arc(lx-10,ly,10,0,7); c.fill(); c.fillStyle='#3d4f49'; c.fillText(t,lx-30-tw/2,ly); lx-=wid+22; }
  }
  cv.__hits=hits; cv.__W=W; cv.__H=H;
  // decorative frame
  c.save(); c.strokeStyle='#d9a441'; c.lineWidth=4; rr(34,34,W-68,H-68,30); c.stroke(); c.lineWidth=1.5; rr(52,52,W-104,H-104,22); c.stroke();
  c.fillStyle='#d9a441'; [[34,34],[W-34,34],[34,H-34],[W-34,H-34]].forEach(([x,y])=>{ c.save(); c.translate(x,y); c.rotate(Math.PI/4); c.fillRect(-9,-9,18,18); c.restore(); }); c.restore();
  return cv;
}
async function makeArt(){
  const T=viewT(); const imgs={};
  try{ await Promise.all([document.fonts.load('700 20px Vazirmatn'),document.fonts.load('400 14px Vazirmatn'),document.fonts.load('700 40px "Aref Ruqaa"')]); }catch(e){}
  await Promise.all(Object.entries(T.P).map(async([id,p])=>{ if(p.photo) imgs[id]=await loadImg(p.photo); }));
  return drawArt(T,imgs);
}
async function renderArt(){
  const box=$('#artBox'); if(!box) return; const tok=++S.artTok;
  let cv; try{ cv=await makeArt(); }catch(e){ box.innerHTML='<div class="wait">کشیدن درخت انجام نشد. نمای نمودار یا فهرستی را امتحان کنید.</div>'; return; }
  if(tok!==S.artTok||!$('#artBox')) return;
  S.artCanvas=cv; const natural=cv.width; const base=Math.max(300,box.clientWidth||natural);
  cv.style.width=Math.round(base*S.artZoom)+'px'; cv.style.height='auto';
  box.innerHTML=''; box.appendChild(cv);
  const hitAt=e=>{ const r=cv.getBoundingClientRect(); if(!r.width) return null; const x=(e.clientX-r.left)/r.width*cv.__W, y=(e.clientY-r.top)/r.height*cv.__H; const hs=cv.__hits||[]; for(let i=hs.length-1;i>=0;i--){ const h=hs[i]; if(x>=h.x1&&x<=h.x2&&y>=h.y1&&y<=h.y2) return h; } return null; };
  cv.addEventListener('click',e=>{ const h=hitAt(e); if(h) openModal(h.id); });
  cv.addEventListener('mousemove',e=>{ cv.style.cursor=hitAt(e)?'pointer':'default'; });
  if(S.artZoom>1) box.scrollLeft=-(box.scrollWidth-box.clientWidth)/2;
}
async function saveBlob(name,blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },5000);
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function saveArt(kind){
  toast('در حال آماده‌سازی فایل…');
  try{
    const cv=await makeArt();
    if(kind==='png'){
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      await saveBlob('shajare-allahrezaei.png',blob); toast('فایل ذخیره شد');
    } else {
      if(!(window.jspdf&&window.jspdf.jsPDF)) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const w=cv.width,h=cv.height, pdf=new window.jspdf.jsPDF({orientation:w>=h?'l':'p',unit:'px',format:[w,h],compress:true});
      pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);
      await saveBlob('shajare-allahrezaei.pdf',pdf.output('blob')); toast('فایل ذخیره شد');
    }
  }catch(e){ if(e&&e.code==='declined') return; toast(kind==='pdf'?'ساخت PDF انجام نشد. فایل PNG را ذخیره کنید':'ذخیره فایل انجام نشد'); }
}

/* ================= photo standardisation ================= */
const PW=240, PH=320;
async function toBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ const url=URL.createObjectURL(file); const im=await loadImg(url); if(!im) throw new Error('bad image'); return im; }
}
async function standardPhoto(file){
  const bmp=await toBitmap(file), iw=bmp.width, ih=bmp.height;
  const s0=Math.min(1,1280/Math.max(iw,ih)), tw=Math.round(iw*s0), th=Math.round(ih*s0);
  const src=document.createElement('canvas'); src.width=tw; src.height=th; src.getContext('2d').drawImage(bmp,0,0,tw,th);
  let face=null, mode='center';
  if(!face&&'FaceDetector' in window){ try{ const fd=new window.FaceDetector({maxDetectedFaces:1}); const r=await fd.detect(src); if(r&&r[0]){ const b=r[0].boundingBox; face={x:b.x,y:b.y,w:b.width,h:b.height}; mode='ai'; } }catch(e){} }
  let fw,fh,fx,fy; // frame in source pixels (3:4)
  if(face){ fh=face.h/0.50; fw=fh*PW/PH; fx=face.x+face.w/2-fw/2; fy=face.y-0.17*fh; }
  else { fh=Math.min(th,tw*PH/PW); fw=fh*PW/PH; fx=(tw-fw)/2; fy=Math.max(0,Math.min(th-fh,(th-fh)*0.25)); }
  const out=document.createElement('canvas'); out.width=PW; out.height=PH; const o=out.getContext('2d');
  const bgG=o.createLinearGradient(0,0,0,PH); bgG.addColorStop(0,'#e9efec'); bgG.addColorStop(1,'#cdd9d4'); o.fillStyle=bgG; o.fillRect(0,0,PW,PH);
  const k=PW/fw, sx=Math.max(0,fx), sy=Math.max(0,fy), ex=Math.min(tw,fx+fw), ey=Math.min(th,fy+fh);
  if(ex>sx&&ey>sy) o.drawImage(src,sx,sy,ex-sx,ey-sy,(sx-fx)*k,(sy-fy)*k,(ex-sx)*k,(ey-sy)*k);
  // gentle auto-levels so lighting looks alike
  try{ const d=o.getImageData(0,0,PW,PH), a=d.data, hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4) hist[Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2])]++;
    const tot=PW*PH; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>tot*.01){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>tot*.01){hi=i;break;} }
    if(hi-lo>40){ const sc=255/(hi-lo), mix=.6; for(let i=0;i<a.length;i+=4) for(let j=0;j<3;j++){ const v=(a[i+j]-lo)*sc; a[i+j]=Math.max(0,Math.min(255,a[i+j]*(1-mix)+v*mix)); } o.putImageData(d,0,0); } }catch(e){}
  return {data:out.toDataURL('image/jpeg',.78),mode};
}

function autoLevels(o){
  try{ const d=o.getImageData(0,0,PW,PH), a=d.data, hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4) hist[Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2])]++;
    const tot=PW*PH; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>tot*.01){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>tot*.01){hi=i;break;} }
    if(hi-lo>40){ const sc=255/(hi-lo), mix=.6; for(let i=0;i<a.length;i+=4) for(let j=0;j<3;j++){ const v=(a[i+j]-lo)*sc; a[i+j]=Math.max(0,Math.min(255,a[i+j]*(1-mix)+v*mix)); } o.putImageData(d,0,0); } }catch(e){}
}
/* manual 3:4 crop: drag to move, slider/wheel to zoom; face auto-placed when the browser supports FaceDetector */
async function cropPhoto(file){
  const bmp=await toBitmap(file), iw=bmp.width, ih=bmp.height;
  const s0=Math.min(1,1600/Math.max(iw,ih)), tw=Math.round(iw*s0), th=Math.round(ih*s0);
  const src=document.createElement('canvas'); src.width=tw; src.height=th; src.getContext('2d').drawImage(bmp,0,0,tw,th);
  const VW=300, VH=400, base=Math.max(VW/tw,VH/th);
  let z=1, ox=0, oy=0, face=null;
  if('FaceDetector' in window){ try{ const r=await new window.FaceDetector({maxDetectedFaces:1}).detect(src); if(r&&r[0]){ const b=r[0].boundingBox; face={x:b.x,y:b.y,w:b.width,h:b.height}; } }catch(e){} }
  const clamp=()=>{ const sc=base*z, mx=Math.max(0,(tw*sc-VW)/2), my=Math.max(0,(th*sc-VH)/2); ox=Math.max(-mx,Math.min(mx,ox)); oy=Math.max(-my,Math.min(my,oy)); };
  if(face){ z=Math.max(1,Math.min(4,(0.5*VH/face.h)/base)); const sc=base*z; ox=-(face.x+face.w/2-tw/2)*sc; oy=0.17*VH-VH/2-(face.y-th/2)*sc; }
  else { oy=Math.max(0,(th*base-VH)/2)*0.6; }
  clamp();
  return new Promise(resolve=>{
    const bg=document.createElement('div'); bg.className='crop-bg';
    bg.innerHTML=`<div class="crop-box" role="dialog" aria-modal="true"><div style="font-weight:700">تنظیم عکس</div>
      <div class="muted small" style="text-align:center">عکس را با انگشت یا ماوس جابه‌جا کنید تا چهره داخل بیضی بیفتد. با لغزنده بزرگ‌نمایی کنید.</div>
      <div class="crop-view" id="cv"><canvas width="${VW*2}" height="${VH*2}"></canvas><div class="crop-oval"></div></div>
      <input type="range" id="cz" min="1" max="4" step="0.01" value="${z}" aria-label="بزرگ‌نمایی">
      <div class="row"><button type="button" class="btn" id="cok">تأیید</button><button type="button" class="btn ghost" id="cno">انصراف</button></div></div>`;
    document.body.appendChild(bg);
    const view=bg.querySelector('#cv'), cv=view.querySelector('canvas'), c=cv.getContext('2d'), zr=bg.querySelector('#cz');
    const draw=(ctx,k,w,h)=>{ const sc=base*z*k; ctx.fillStyle='#d6e0dc'; ctx.fillRect(0,0,w,h); ctx.drawImage(src,w/2+ox*k-tw*sc/2,h/2+oy*k-th*sc/2,tw*sc,th*sc); };
    const paint=()=>draw(c,2,VW*2,VH*2);
    paint();
    const rect=()=>view.getBoundingClientRect();
    let drag=null;
    view.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,ox,oy}; view.setPointerCapture(e.pointerId); view.style.cursor='grabbing'; });
    view.addEventListener('pointermove',e=>{ if(!drag) return; const f=VW/rect().width; ox=drag.ox+(e.clientX-drag.x)*f; oy=drag.oy+(e.clientY-drag.y)*f; clamp(); paint(); });
    const up=()=>{ drag=null; view.style.cursor='grab'; };
    view.addEventListener('pointerup',up); view.addEventListener('pointercancel',up);
    view.addEventListener('wheel',e=>{ e.preventDefault(); z=Math.max(1,Math.min(4,z*(e.deltaY<0?1.06:.94))); zr.value=z; clamp(); paint(); },{passive:false});
    zr.addEventListener('input',()=>{ z=parseFloat(zr.value)||1; clamp(); paint(); });
    const done=v=>{ bg.remove(); resolve(v); };
    bg.querySelector('#cno').onclick=()=>done(null);
    bg.querySelector('#cok').onclick=()=>{
      const out=document.createElement('canvas'); out.width=PW; out.height=PH; const o=out.getContext('2d');
      draw(o,PW/VW,PW,PH); autoLevels(o); done(out.toDataURL('image/jpeg',.82));
    };
  });
}

async function markSub(it,status){

  const patch={status}; if(it.kind==='person'&&it.payload&&it.payload.photo) patch.payload={photo:''};
  await S.db.doc('subs/'+it.uid+'_'+it.id).update(patch);

async function approveOne(it){

    await S.db.doc('memories/'+it.id).set(Object.assign({kind:'memory'},it.payload,{author:it.payload.author||it.by||'',at:it.at}));
  }

}

async function sbAuth(body,grant){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw {code:r.status,message:j.error_description||j.msg||j.message||'خطا'};

async function sbFetch(path,opt){
  opt=opt||{};
  const go=()=>fetch(CFG.url+path,{method:opt.method||'GET',headers:Object.assign({apikey:CFG.key,Authorization:'Bearer '+(SB.tok||CFG.key),'Content-Type':'application/json'},opt.headers||{}),body:opt.body});
  let r=await go();
  if(r.status===401&&SB.refresh&&!opt.retried){ try{ await sbRefresh(); }catch(e){} opt.retried=1; r=await go(); }
  if(!r.ok) throw {code:r.status,message:await r.text().catch(()=>'')};
  const t=await r.text(); return t?JSON.parse(t):null;
}
function dmerge(a,b){ const o=Object.assign({},a); for(const k in b){ const v=b[k]; o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?dmerge(o[k],v):v; } return o; }
function mkDb(){
  const enc=encodeURIComponent, parentOf=p=>p.split('/').slice(0,-1).join('/');
  const pollers=new Set(); let timer=null;
  const poke=()=>setTimeout(()=>pollers.forEach(f=>f()),60);
  const ensure=()=>{ if(timer) return; timer=setInterval(()=>{ if(!document.hidden) pollers.forEach(f=>f()); },20000); };
  const snapDoc=(path,data)=>({id:path.split('/').pop(),exists:data!=null,data:()=>data});
  const doc=path=>({
    id:path.split('/').pop(), path,
    async get(){ const r=await sbFetch('/rest/v1/shj_docs?select=data&path=eq.'+enc(path)); return snapDoc(path,r&&r[0]?r[0].data:null); },
    async set(d){
      const row={path,parent:parentOf(path),data:d,updated_at:new Date().toISOString()};
      if(S.isAdmin){
        const upd=await sbFetch('/rest/v1/shj_docs?path=eq.'+enc(path),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:d,updated_at:row.updated_at})});
        if(!upd||!upd.length) await sbFetch('/rest/v1/shj_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
      }
      else await sbFetch('/rest/v1/shj_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
      poke();
    },
    async update(d){ const cur=await this.get(); if(!cur.exists) throw {code:'invalid_argument'}; await this.set(dmerge(cur.data(),d)); },
    async delete(){ await sbFetch('/rest/v1/shj_docs?path=eq.'+enc(path),{method:'DELETE'}); poke(); }
  });
  const collection=parent=>({
    onSnapshot(next,err){
      let sig=''; 
      const run=async()=>{
        try{
          const meta=await sbFetch('/rest/v1/shj_docs?select=path,updated_at&parent=eq.'+enc(parent)+'&order=path.asc&limit=5000');
          const sg=JSON.stringify(meta); if(sg===sig) return;
          const rows=await sbFetch('/rest/v1/shj_docs?select=path,data&parent=eq.'+enc(parent)+'&order=path.asc&limit=5000');
          sig=sg; next({docs:(rows||[]).map(x=>snapDoc(x.path,x.data)),size:(rows||[]).length});
        }catch(e){ if(err) err({code:(e&&e.code)||'unavailable'}); }
      };
      pollers.add(run); ensure(); run(); return ()=>pollers.delete(run);
    }
  });
  return {doc,collection};
}

  const db=mkDb(); S.db=db;

  db.collection('people').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.people=o; S.dbError=null; changed(); },err);
  db.collection('memories').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.memories=o; changed(); },err);

    if(!S.db) startData(); else startSubs();
    render();
  }catch(e){ const em=String((e&&e.message)||''); const net=(e instanceof TypeError)||/Failed to fetch|NetworkError|Load failed|network/i.test(em);
    S.loginErr=net?'ارتباط با سرور برقرار نشد. اینترنت را بررسی کنید. اگر فیلترشکن روشن است آن را خاموش کنید یا سرور آن را عوض کنید و دوباره امتحان کنید.':(e&&e.code===400)?'رمز یا ایمیل درست نیست. رمز را با کیبورد انگلیسی بنویسید.':((e&&e.message&&e.code!==undefined&&typeof e.code==='number')?'ورود انجام نشد. اینترنت را بررسی کنید':(e&&e.message)||'ورود انجام نشد'); render(); }
}

/* ================= boot ================= */
function setupManifest(){
  try{
    const ic=(document.querySelector('link[rel=icon]')||{}).href, base=location.href.split('#')[0];
    const man={name:'شجره‌نامه خاندان الله‌رضایی',short_name:'شجره‌نامه',lang:'fa',dir:'rtl',start_url:base,scope:base.replace(/[^/]*$/,''),display:'standalone',background_color:'#F1F5F3',theme_color:'#1E5B50',icons:[{src:ic,sizes:'192x192',type:'image/png'},{src:window.SHJ_ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})); document.head.appendChild(l);
  }catch(e){}
}
async function boot(){ setupManifest();
  render();
  if(!sbReady()){ S.gate=true; S.ready=true; render(); return; }
  try{ const m=JSON.parse(lsGet('shj_me')||'null'); if(m&&m.first&&m.last) S.me=m; }catch(e){}
  S.uid=lsGet('shj_uid')||(()=>{ const a=new Uint8Array(8); crypto.getRandomValues(a); const u='u'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(''); lsSet('shj_uid',u); return u; })();
  try{ S.mySub=JSON.parse(lsGet('shj_mysub')||'null'); }catch(e){}
  try{ const ss=JSON.parse(lsGet('shj_sess')||'null'); if(ss&&ss.r){ SB.refresh=ss.r; SB.email=ss.e||''; await sbRefresh(); S.authed=true; S.isAdmin=SB.email.toLowerCase()===CFG.adminEmail.toLowerCase(); } }catch(e){ lsSet('shj_sess',''); }
  S.ready=true;
  if(S.authed) startData();
  render();
}
boot();
})();
</script>
