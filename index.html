  const ids=Object.keys(R).sort();
  ids.forEach(id=>{
    const p=R[id], q=P[id], opp=p.gender==='m'?'f':p.gender==='f'?'m':'';
    q.fatherId=R[p.fatherId]?p.fatherId:resolve(p.fatherRef,'m',id);
    q.motherId=R[p.motherId]?p.motherId:resolve(p.motherRef,'f',id);
    q.spouseId=R[p.spouseId]?p.spouseId:resolve(p.spouseRef,opp,id);
  });
  ids.forEach(id=>{
    String(R[id].kidNames||'').split(/\n|،|,/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
      const k=nn(line);
      const ex=Object.keys(P).some(c=>c!==id&&(P[c].fatherId===id||P[c].motherId===id)&&(nn(full(P[c]))===k||nn(P[c].first)===k));
      if(ex) return;
      const me=P[id], isF=me.gender==='f', sp=P[me.spouseId]?me.spouseId:'';
      const f=isF?(sp&&P[sp].gender!=='f'?sp:''):id, m=isF?id:(sp&&P[sp].gender!=='m'?sp:'');
      const s=split(line);
      const vid=ghost('v_'+hash('kid|'+k+'|'+f+'|'+m),{first:s.first,last:s.last||me.last||'',gender:'',fatherId:f,motherId:m});
      P[vid].fatherId=f; P[vid].motherId=m;
    });
  });
  return {P,virt};
}

/* ================= tree model ================= */
function buildTree(){
  if(S.T) return S.T;
  const E=effective(), P=E.P, ids=Object.keys(P);
  const has=id=>!!(id&&P[id]);
  const hasParents=id=>has(P[id].fatherId)||has(P[id].motherId);
  const partners={}; ids.forEach(i=>partners[i]=new Set());
  const link=(a,b)=>{ if(a&&b&&a!==b&&has(a)&&has(b)){partners[a].add(b);partners[b].add(a);} };
  ids.forEach(i=>{ const p=P[i]; link(i,p.spouseId); if(has(p.fatherId)&&has(p.motherId)) link(p.fatherId,p.motherId); });
  const marryIn={}; ids.forEach(i=>{ marryIn[i]=!hasParents(i)&&[...partners[i]].some(q=>hasParents(q)); });
  const placeOf=i=>{ const p=P[i]; if(has(p.fatherId)&&!marryIn[p.fatherId]) return p.fatherId; if(has(p.motherId)&&!marryIn[p.motherId]) return p.motherId; return null; };
  const kidsOf={}; ids.forEach(i=>{ const pl=placeOf(i); if(pl&&pl!==i) (kidsOf[pl]=kidsOf[pl]||[]).push(i); });
  const byBirth=(a,b)=>{ const ya=P[a].bY,yb=P[b].bY; if(ya&&yb&&ya!==yb) return ya-yb; if(ya&&!yb) return -1; if(!ya&&yb) return 1; return (P[a].first||'').localeCompare(P[b].first||'','fa'); };
  Object.values(kidsOf).forEach(a=>a.sort(byBirth));
  const cands=ids.filter(i=>!marryIn[i]&&(!placeOf(i)||placeOf(i)===i));
  cands.sort((a,b)=>(P[a].gender==='m'?0:1)-(P[b].gender==='m'?0:1)||byBirth(a,b));
  const used=new Set(), rootSpec=[];
  cands.forEach(r=>{ if(used.has(r)) return; used.add(r); const extra=[]; partners[r].forEach(q=>{ if(cands.includes(q)&&!used.has(q)){used.add(q);extra.push(q);} }); rootSpec.push({id:r,extra}); });
  const vis=new Set(), shown=new Set(), nodes=[], gen={};
  function mk(id,extra,depth){
    if(vis.has(id)) return null; vis.add(id); shown.add(id);
    const sp=new Set(extra||[]); partners[id].forEach(q=>sp.add(q)); sp.delete(id);
    const spouses=[...sp].filter(q=>P[q]); spouses.forEach(q=>{ shown.add(q); if(gen[q]==null) gen[q]=depth; });
    if(gen[id]==null) gen[id]=depth;
    const n={id,spouses,kids:[],depth,size:0,set:null}; nodes.push(n);
    n.kids=(kidsOf[id]||[]).map(c=>mk(c,null,depth+1)).filter(Boolean);
    const set=new Set([id,...spouses]); n.kids.forEach(k=>k.set.forEach(x=>set.add(x)));
    n.set=set; n.size=set.size; return n;
  }
  const roots=rootSpec.map(r=>mk(r.id,r.extra,1)).filter(Boolean);
  const unplaced=ids.filter(i=>!shown.has(i)).sort(byBirth);
  const couples=new Set(); ids.forEach(i=>partners[i].forEach(q=>couples.add([i,q].sort().join('|'))));
  S.T={P,virt:E.virt,roots,nodes,unplaced,gen,couples:couples.size};
  return S.T;
}
const EP=()=>buildTree().P;
function nameOf(id){ if(!id) return ''; const p=EP()[id]; if(p) return full(p); const m=pendingItems()[id]; return m?full(m.p)+' (در انتظار)':''; }

}

function computeStats(){
  const T=buildTree(), P=T.P, all=Object.values(P), real=Object.values(S.people);
  const m=all.filter(p=>p.gender==='m').length, f=all.filter(p=>p.gender==='f').length;
  const dead=all.filter(p=>p.dead).length;
  const gens={}; Object.entries(T.gen).forEach(([id,g])=>{ if(P[id]) gens[g]=(gens[g]||0)+1; });
  const fams=T.nodes.filter(n=>n.kids.length||n.spouses.length).map(n=>{
    const ks=n.kids.map(k=>P[k.id]);
    return {n,title:full(P[n.id])+(n.spouses.length?' و '+n.spouses.map(q=>P[q].first||'').join(' و '):''),
      kids:ks.length,sons:ks.filter(p=>p.gender==='m').length,daus:ks.filter(p=>p.gender==='f').length,size:n.size,depth:n.depth};
  });
  const withKids=fams.filter(x=>x.kids);
  const living=real.filter(p=>!p.dead&&p.bY);
  const age=p=>ageNow(p);
  const groups=[['تا ۱۷ سال',0,17],['۱۸ تا ۳۴',18,34],['۳۵ تا ۴۹',35,49],['۵۰ تا ۶۴',50,64],['۶۵ به بالا',65,200]].map(([l,a,b])=>({l,c:living.filter(p=>{const x=age(p);return x!=null&&x>=a&&x<=b;}).length}));
  const byAge=living.filter(p=>age(p)!=null).sort((a,b)=>age(b)-age(a));
  const lifespans=real.filter(p=>p.dead&&p.bY&&p.dY&&p.dY>=p.bY).map(p=>p.dY-p.bY);
  const months=Array(12).fill(0); real.forEach(p=>{ if(p.bM) months[p.bM-1]++; });
  const top=k=>{ const c={}; real.forEach(p=>{ const v=nn(p[k]); if(v) c[v]=(c[v]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5); };
  const pc=f=>real.length?Math.round(real.filter(f).length/real.length*100):0;
  const memCount={}; Object.values(S.memories).forEach(x=>{ memCount[x.personId]=(memCount[x.personId]||0)+1; });
  const mostMem=Object.entries(memCount).filter(([id])=>P[id]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {total:all.length,m,f,dead,alive:all.length-dead,gens,fams,famCount:withKids.length,
    avg:withKids.length?withKids.reduce((s,x)=>s+x.kids,0)/withKids.length:0,mem:Object.keys(S.memories).length,
    virt:T.virt.size,couples:T.couples,groups,oldest:byAge[0],youngest:byAge[byAge.length-1],
    lifespan:lifespans.length?lifespans.reduce((a,b)=>a+b,0)/lifespans.length:0,months,places:top('place'),jobs:top('job'),
    comp:{birth:pc(p=>p.bY),date:pc(p=>p.bY&&p.bM&&p.bD),photo:pc(p=>p.photo),parents:pc(p=>p.fatherId||p.motherId||(p.fatherRef&&p.fatherRef.name)||(p.motherRef&&p.motherRef.name))},
    mostMem,realCount:real.length};
}

function opts(filter,sel,self,withNew){
  const arr=Object.entries(pendingItems()).filter(([id,r])=>id!==self&&(!filter||filter(r.p))).sort((a,b)=>full(a[1].p).localeCompare(full(b[1].p),'fa'));
  return '<option value="">— نامشخص —</option>'+(withNew?`<option value="__new" ${sel==='__new'?'selected':''}>در فهرست نیست؛ نامش را می‌نویسم</option>`:'')+arr.map(([id,r])=>`<option value="${esc(id)}" ${id===sel?'selected':''}>${esc(pickLabel(id,r))}</option>`).join('');
}
function dateW(p,v){
  v=v||{};
  return `<div class="dw"><select id="${p}_d" aria-label="روز"><option value="">روز</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${v.d===i+1?'selected':''}>${fa(i+1)}</option>`).join('')}</select>
  <select id="${p}_m" aria-label="ماه"><option value="">ماه</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${v.m===i+1?'selected':''}>${n}</option>`).join('')}</select>
  <input type="text" id="${p}_y" inputmode="numeric" placeholder="سال، مثلاً ۱۳۶۰" value="${v.y?fa(v.y):''}" aria-label="سال"></div>`;
}
function readDate(p){
  let y=parseInt(norm($('#'+p+'_y').value),10)||0, m=parseInt($('#'+p+'_m').value,10)||0, d=parseInt($('#'+p+'_d').value,10)||0;
  if(y&&(y<1200||y>nowYear)) y=0;
  if(m&&d&&d>monthLen(y||1403,m)) d=monthLen(y||1403,m);
  return {y,m,d};
}

function personSheet(id){
  const P=EP(), p=P[id]; if(!p) return '<p>این فرد پیدا نشد.</p><button class="btn" data-act="close">بستن</button>';
  if(p.virtual){
    return `<button class="btn ghost sm x" data-act="close">بستن</button><div><h2>${esc(full(p))}</h2><div class="muted">${[gLabel(p.gender),p.bY?dstr(p.bY,p.bM,p.bD):''].filter(Boolean).map(esc).join('، ')}</div></div>
    <div class="note">این نام فقط توسط یکی از اعضا به‌عنوان پدر، مادر، همسر یا فرزند نوشته شده و پرونده‌اش هنوز ثبت نشده است. اگر او را می‌شناسید اطلاعاتش را کامل کنید.</div>
    <div class="row"><button class="btn" data-act="fillvirt" data-id="${esc(id)}">ثبت اطلاعات ${esc(p.first)}</button></div>`;
  }
  const chip=i=>P[i]?`<button class="chip" data-act="person" data-id="${esc(i)}">${esc(full(P[i]))}</button>`:'';
  const kids=Object.keys(P).filter(i=>P[i].fatherId===id||P[i].motherId===id);
  const sib=Object.keys(P).filter(i=>i!==id&&((p.fatherId&&P[i].fatherId===p.fatherId)||(p.motherId&&P[i].motherId===p.motherId)));
  const spouses=new Set(); if(P[p.spouseId]) spouses.add(p.spouseId); Object.keys(P).forEach(i=>{ if(P[i].spouseId===id) spouses.add(i); }); kids.forEach(k=>{ const o=P[k].fatherId===id?P[k].motherId:P[k].fatherId; if(P[o]) spouses.add(o); });
  const rows=[['پدر',P[p.fatherId]?[p.fatherId]:[]],['مادر',P[p.motherId]?[p.motherId]:[]],['همسر',[...spouses]],['فرزندان',kids],['برادر و خواهر',sib]].filter(r=>r[1].length);
  const mems=Object.entries(S.memories).filter(([,m])=>m.personId===id).sort((a,b)=>(a[1].at||0)-(b[1].at||0));
  const a=ageNow(p);
  const info=[gLabel(p.gender),p.dead?'درگذشته':'در قید حیات',dstr(p.bY,p.bM,p.bD)?'تولد '+dstr(p.bY,p.bM,p.bD):'',p.dead&&dstr(p.dY,p.dM,p.dD)?'درگذشت '+dstr(p.dY,p.dM,p.dD):'',a!=null?(p.dead?fa(a)+' سال عمر کرد':fa(a)+' ساله'):'',p.place,p.job].filter(Boolean);
  const cf=S.confirm;
  const memGroup=(k,title)=>{ const l=mems.filter(([,m])=>(m.kind||'memory')===k); if(!l.length) return ''; return `<div class="stack" style="gap:8px"><span class="kind">${title}</span>${l.map(([mid,m])=>`<div class="mem"><p>${esc(m.text)}</p><div class="row" style="justify-content:space-between"><span class="muted small">— ${esc(m.author||'')}</span>${S.isAdmin?`<button class="btn danger sm" data-act="delmem" data-id="${esc(mid)}">${cf==='m'+mid?'مطمئنم، حذف شود':'حذف'}</button>`:''}</div></div>`).join('')}</div>`; };
  return `<button class="btn ghost sm x" data-act="close">بستن</button>
   <div class="sheet-head">${p.photo?`<img class="ph" src="${esc(p.photo)}" alt="">`:''}<div style="min-width:0"><h2>${esc(full(p))}</h2><div class="muted">${info.map(esc).join('، ')}</div></div></div>
   ${p.note?`<div class="note">${esc(p.note)}</div>`:''}
   ${rows.length?`<div class="stack" style="gap:10px">${rows.map(r=>`<div class="row" style="gap:6px;align-items:baseline"><span class="muted small" style="min-width:84px">${r[0]}</span>${r[1].map(chip).join('')}</div>`).join('')}</div>`:'<p class="muted small" style="margin:0">پیوندی با اعضای دیگر ثبت نشده است.</p>'}

const imgCache=new Map();
function loadImg(src){
  if(imgCache.has(src)) return imgCache.get(src);
  const pr=new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
  imgCache.set(src,pr); return pr;
}
function drawArt(T,imgs){
  const P=T.P, R=46, GAP=280, CW=2*R+46, MARGIN=140, TRUNK=230, ROOTS=150, TOP=330;
  let maxD=1; T.nodes.forEach(n=>{ if(n.depth>maxD) maxD=n.depth; });
  const lay=n=>{ n.cw=(1+n.spouses.length)*CW; n.kids.forEach(lay); n.kw=n.kids.reduce((s,k)=>s+k.aw,0); n.aw=Math.max(n.kw,n.cw+40); };
  T.roots.forEach(lay);
  const put=(n,left)=>{ n.cx=left+n.aw/2; let xr=left+n.aw-(n.aw-n.kw)/2; n.kids.forEach(k=>{ put(k,xr-k.aw); xr-=k.aw; }); };
  const content=T.roots.reduce((s,r)=>s+r.aw,0)+80*(T.roots.length-1);
  const W=Math.max(1500,content+MARGIN*2);
  let xr=W-(W-content)/2; T.roots.forEach(r=>{ put(r,xr-r.aw); xr-=r.aw+80; });
  const cyOf=n=>TOP+(maxD-n.depth)*GAP+R+34;
  const groundY=TOP+(maxD-1)*GAP+R+34+TRUNK, H=groundY+ROOTS+120;
  const sc=Math.min(1,7000/Math.max(W,H),Math.sqrt(40e6/(W*H)));
  const cv=document.createElement('canvas'); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc);
  const c=cv.getContext('2d'); c.scale(sc,sc); c.direction='rtl'; c.textAlign='center'; c.textBaseline='middle';
  let seed=1337; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const GREENS=['#2f7d4f','#3f9460','#5aa86f','#7cc08a','#2a6b45','#4c9a62'], BARK1='#5b3d26', BARK2='#8a6240';
  // background
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffffff'); g.addColorStop(.7,'#f3f8f4'); g.addColorStop(1,'#e2eee5'); c.fillStyle=g; c.fillRect(0,0,W,H);
  // ground
  c.fillStyle='#cfe3d3'; c.beginPath(); c.moveTo(0,groundY); c.bezierCurveTo(W*.25,groundY-38,W*.5,groundY+14,W*.75,groundY-26); c.bezierCurveTo(W*.88,groundY-40,W*.95,groundY-8,W,groundY-18); c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();
  c.fillStyle='#b9d6bf'; c.beginPath(); c.moveTo(0,groundY+34); c.bezierCurveTo(W*.3,groundY+8,W*.6,groundY+56,W,groundY+18); c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();
  const bw=n=>Math.min(80,10+Math.sqrt(n.size)*5.5);
  // canopy glow
  T.nodes.forEach(n=>{ if(n.depth>=Math.max(2,maxD-1)){ const y=cyOf(n); const rg=c.createRadialGradient(n.cx,y,10,n.cx,y,GAP*.9); rg.addColorStop(0,'rgba(90,168,111,.20)'); rg.addColorStop(1,'rgba(90,168,111,0)'); c.fillStyle=rg; c.beginPath(); c.arc(n.cx,y,GAP*.9,0,7); c.fill(); } });
  // roots and trunks
  T.roots.forEach(r=>{
    const w=bw(r), y1=cyOf(r), x=r.cx;
    for(let i=0;i<7;i++){ const dir=i%2?1:-1, k=(i+1)/7, ex=x+dir*(60+rnd()*220)*(.6+k), ey=groundY+ROOTS*(.55+rnd()*.5);
      c.strokeStyle=BARK1; c.lineCap='round'; c.lineWidth=Math.max(3,w*(.55-k*.35)); c.beginPath(); c.moveTo(x+dir*w*.3,groundY-6); c.bezierCurveTo(x+dir*w*1.1,groundY+ROOTS*.25,ex-dir*60,groundY+ROOTS*.4,ex,ey); c.stroke(); }
    const lg=c.createLinearGradient(x-w,0,x+w,0); lg.addColorStop(0,BARK1); lg.addColorStop(.5,BARK2); lg.addColorStop(1,BARK1);
    c.fillStyle=lg; c.beginPath(); c.moveTo(x-w/2,y1); c.bezierCurveTo(x-w/2,y1+TRUNK*.5,x-w*.95,groundY-TRUNK*.25,x-w*1.05,groundY+8); c.lineTo(x+w*1.05,groundY+8); c.bezierCurveTo(x+w*.95,groundY-TRUNK*.25,x+w/2,y1+TRUNK*.5,x+w/2,y1); c.closePath(); c.fill();
    c.strokeStyle='rgba(40,25,12,.28)'; c.lineWidth=2; for(let i=-1;i<=1;i++){ c.beginPath(); c.moveTo(x+i*w*.22,y1+20); c.bezierCurveTo(x+i*w*.3,y1+TRUNK*.4,x+i*w*.4,groundY-TRUNK*.3,x+i*w*.5,groundY); c.stroke(); }
  });
  // branches
  const leaves=[], bez=(t,a,b,cc,d)=>{ const u=1-t; return u*u*u*a+3*u*u*t*b+3*u*t*t*cc+t*t*t*d; };
  const branch=(n)=>{ const px=n.cx, py=cyOf(n);
    n.kids.forEach(k=>{ const kx=k.cx, ky=cyOf(k), w=bw(k);
      const x1=px, y1=py, x2=px, y2=py-GAP*.5, x3=kx, y3=ky+GAP*.5, x4=kx, y4=ky;
      c.lineCap='round'; c.strokeStyle=BARK1; c.lineWidth=w; c.beginPath(); c.moveTo(x1,y1); c.bezierCurveTo(x2,y2,x3,y3,x4,y4); c.stroke();
      c.strokeStyle='rgba(255,230,190,.22)'; c.lineWidth=Math.max(1.5,w*.28); c.beginPath(); c.moveTo(x1-w*.15,y1); c.bezierCurveTo(x2-w*.15,y2,x3-w*.15,y3,x4-w*.15,y4); c.stroke();
      const cnt=9+Math.round(Math.sqrt(k.size)*3); for(let i=0;i<cnt;i++){ const t=.12+rnd()*.78; leaves.push({x:bez(t,x1,x2,x3,x4)+(rnd()-.5)*w,y:bez(t,y1,y2,y3,y4)+(rnd()-.5)*w}); }
      branch(k); }); };
  T.roots.forEach(branch);
  // leaves
  const leaf=(x,y,ang,s,col)=>{ c.save(); c.translate(x,y); c.rotate(ang); c.fillStyle=col; c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(s*.6,-s*.55,s*1.7,0); c.quadraticCurveTo(s*.6,s*.55,0,0); c.fill(); c.restore(); };
  leaves.forEach(l=>{ for(let i=0;i<3;i++){ leaf(l.x,l.y,rnd()*6.28,11+rnd()*10,rnd()<.07?'#d9a441':GREENS[Math.floor(rnd()*GREENS.length)]); } });
  // people
  const fit=(txt,maxW,size,weight)=>{ let s=size; c.font=`${weight} ${s}px Vazirmatn, Tahoma, sans-serif`; while(c.measureText(txt).width>maxW&&s>10){ s--; c.font=`${weight} ${s}px Vazirmatn, Tahoma, sans-serif`; } };
  const person=(id,x,y)=>{
    const p=P[id]; if(!p) return;
    const col=p.gender==='m'?'#3A7CA5':p.gender==='f'?'#B0527A':'#7a8a85';
    c.save(); c.shadowColor='rgba(0,0,0,.25)'; c.shadowBlur=12; c.shadowOffsetY=4; c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,R+6,0,7); c.fill(); c.restore();
    c.save(); c.beginPath(); c.arc(x,y,R,0,7); c.clip();
    const im=imgs[id];
    if(im){ const sz=Math.max(2*R/im.width,2*R/im.height); const w=im.width*sz,h=im.height*sz; if(p.dead){ try{ c.filter='grayscale(1)'; }catch(e){} } c.drawImage(im,x-w/2,y-R-(h-2*R)*.18,w,h); }
    else { c.fillStyle=col+'33'; c.fillRect(x-R,y-R,2*R,2*R); c.fillStyle=col; c.font='700 40px Vazirmatn, Tahoma, sans-serif'; c.fillText((p.first||'؟').trim()[0]||'؟',x,y+2); }
    c.restore();
    c.strokeStyle=col; c.lineWidth=5; c.setLineDash(p.virtual?[7,6]:[]); c.beginPath(); c.arc(x,y,R+3,0,7); c.stroke(); c.setLineDash([]);
    const nm=full(p), ly=y+R+26; fit(nm,CW+10,17,700); const tw=Math.min(c.measureText(nm).width+22,CW+30);
    const yl=lifeLine(p), ph=yl?48:30, pw=yl?Math.max(tw,90):tw;
    c.fillStyle='rgba(255,255,255,.95)'; c.strokeStyle='#c5d3ce'; c.lineWidth=1.5; c.beginPath(); c.roundRect?c.roundRect(x-pw/2,ly-15,pw,ph,9):c.rect(x-pw/2,ly-15,pw,ph); c.fill(); c.stroke();
    c.fillStyle=p.dead?'#5A726B':'#14302A'; c.fillText(nm,x,ly+1);
    if(yl){ c.font='400 13px Vazirmatn, Tahoma, sans-serif'; c.fillStyle='#5A726B'; c.fillText(yl,x,ly+23); }
  };
  const drawNodes=n=>{ const y=cyOf(n), ids=[n.id,...n.spouses], total=ids.length*CW; let x=n.cx+total/2-CW/2;
    ids.forEach((id,i)=>{ person(id,x,y); if(i<ids.length-1){ c.strokeStyle='#d9a441'; c.lineWidth=4; c.beginPath(); c.arc(x-CW/2,y,8,0,7); c.stroke(); } x-=CW; });
    n.kids.forEach(drawNodes); };
  T.roots.forEach(drawNodes);
  // title
  c.fillStyle='#1E5B50'; c.font='700 74px "Aref Ruqaa", Vazirmatn, serif'; c.fillText('شجره‌نامه خاندان الله‌رضایی',W/2,110);
  c.fillStyle='#5A726B'; c.font='400 26px Vazirmatn, Tahoma, sans-serif'; c.fillText(`${fa(Object.keys(P).length)} نفر، ${fa(maxD)} نسل، ${dstr(TODAY.y,TODAY.m,TODAY.d)}`,W/2,190);
  c.strokeStyle='#d9a441'; c.lineWidth=3; c.beginPath(); c.moveTo(W/2-120,232); c.lineTo(W/2+120,232); c.stroke();
  return cv;
}
async function makeArt(){
  const T=buildTree(); const imgs={};
  try{ await Promise.all([document.fonts.load('700 20px Vazirmatn'),document.fonts.load('400 14px Vazirmatn'),document.fonts.load('700 40px "Aref Ruqaa"')]); }catch(e){}
  await Promise.all(Object.entries(T.P).map(async([id,p])=>{ if(p.photo) imgs[id]=await loadImg(p.photo); }));
  return drawArt(T,imgs);
}

/* ================= photo standardisation ================= */
const PW=240, PH=320;
async function toBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ const url=URL.createObjectURL(file); const im=await loadImg(url); if(!im) throw new Error('bad image'); return im; }
}
async function standardPhoto(file){
  const bmp=await toBitmap(file), iw=bmp.width, ih=bmp.height;
  const s0=Math.min(1,1280/Math.max(iw,ih)), tw=Math.round(iw*s0), th=Math.round(ih*s0);
  const src=document.createElement('canvas'); src.width=tw; src.height=th; src.getContext('2d').drawImage(bmp,0,0,tw,th);
  let face=null, mode='center';
  if(S.sample){
    try{
      const blob=await new Promise(r=>src.toBlob(r,'image/jpeg',.85));
      const prompt='This is a photo of one person. Locate the main person\'s head (top of hair to bottom of chin, full width of the head). Reply with only JSON: {"found":true,"x":0.30,"y":0.15,"w":0.35,"h":0.40} where x,y are the top-left corner of the head box and w,h its size, all as fractions (0 to 1) of the image width and height. If no face is visible reply {"found":false}.';
      const r=await S.sample.json(prompt,{images:blob,modelTier:'quick'});
      if(r&&r.found&&r.w>0.03&&r.h>0.03&&r.x>=0&&r.y>=0&&r.x+r.w<=1.05&&r.y+r.h<=1.05){ face={x:r.x*tw,y:r.y*th,w:r.w*tw,h:r.h*th}; mode='ai'; }
    }catch(e){ face=null; }
  }
  if(!face&&'FaceDetector' in window){ try{ const fd=new window.FaceDetector({maxDetectedFaces:1}); const r=await fd.detect(src); if(r&&r[0]){ const b=r[0].boundingBox; face={x:b.x,y:b.y,w:b.width,h:b.height}; mode='ai'; } }catch(e){} }
  let fw,fh,fx,fy; // frame in source pixels (3:4)
  if(face){ fh=face.h/0.50; fw=fh*PW/PH; fx=face.x+face.w/2-fw/2; fy=face.y-0.17*fh; }
  else { fh=Math.min(th,tw*PH/PW); fw=fh*PW/PH; fx=(tw-fw)/2; fy=Math.max(0,Math.min(th-fh,(th-fh)*0.25)); }
  const out=document.createElement('canvas'); out.width=PW; out.height=PH; const o=out.getContext('2d');
  const bgG=o.createLinearGradient(0,0,0,PH); bgG.addColorStop(0,'#e9efec'); bgG.addColorStop(1,'#cdd9d4'); o.fillStyle=bgG; o.fillRect(0,0,PW,PH);
  const k=PW/fw, sx=Math.max(0,fx), sy=Math.max(0,fy), ex=Math.min(tw,fx+fw), ey=Math.min(th,fy+fh);
  if(ex>sx&&ey>sy) o.drawImage(src,sx,sy,ex-sx,ey-sy,(sx-fx)*k,(sy-fy)*k,(ex-sx)*k,(ey-sy)*k);
  // gentle auto-levels so lighting looks alike
  try{ const d=o.getImageData(0,0,PW,PH), a=d.data, hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4) hist[Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2])]++;
    const tot=PW*PH; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>tot*.01){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>tot*.01){hi=i;break;} }
    if(hi-lo>40){ const sc=255/(hi-lo), mix=.6; for(let i=0;i<a.length;i+=4) for(let j=0;j<3;j++){ const v=(a[i+j]-lo)*sc; a[i+j]=Math.max(0,Math.min(255,a[i+j]*(1-mix)+v*mix)); } o.putImageData(d,0,0); } }catch(e){}
  return {data:out.toDataURL('image/jpeg',.78),mode};
}

  const nav=$('#nav'); if(!nav) return;
  const tabs=TABS.slice(); if(S.isAdmin) tabs.push(['admin','مدیریت']);
  const pc=S.isAdmin?pendingList().length:0;
  nav.innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${l}${k==='admin'&&pc?`<span class="badge">${fa(pc)}</span>`:''}</button>`).join('');
}
function renderView(){
  const v=$('#view'); if(!v) return;
  const f={home:viewHome,tree:viewTree,stats:viewStats,add:viewAdd,admin:viewAdmin}[S.tab]||viewHome;
  v.innerHTML=f();
  if(S.tab==='tree'){ if(S.mode==='art') renderArt(); else if(S.mode==='chart'){ const b=$('#chartBox'); if(b) b.scrollLeft=-(b.scrollWidth-b.clientWidth)/2; } }
}
let rq=0;
function changed(){ S.T=null; if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; if(!S.me||!S.ready) return; renderNav(); if(S.tab==='add') refreshAdd(); else renderView(); if(S.modal) $('#sheet').innerHTML=personSheet(S.modal); }); }

/* ================= actions ================= */
function gotoTab(t){ S.tab=t; S.code=null; closeModal(); renderNav(); renderView(); window.scrollTo(0,0); }
const val=id=>{ const e=$(id); return e?e.value.trim():''; };
function resetPhoto(from){ S.photo=from||''; S.photoDirty=false; S.photoMsg=''; }

async function submitSub(kind,payload,id,editOf){
  const item={uid:S.uid,id,kind,payload,by:fullName(),at:Date.now(),status:'pending'}; if(editOf) item.editOf=editOf;
  await S.db.doc('subs/'+S.uid+'_'+id).set(item);
  const keep=JSON.parse(JSON.stringify(item)); if(keep.payload) keep.payload.photo='';
  const my=S.mySub||{items:{}}; my.items[id]=keep; S.mySub=my; lsSet('shj_mysub',JSON.stringify(my));
}
function makeCode(kind,payload,id,editOf){
  const o={k:kind,p:payload,id,by:fullName(),at:Date.now()}; if(editOf) o.e=editOf;
  return 'SHJ1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
async function deliver(kind,payload,id,editOf){
  if(!S.uid){ S.code=makeCode(kind,Object.assign({},payload,{photo:''}),id,editOf); return 'code'; }
  try{ await submitSub(kind,payload,id,editOf); return 'sent'; }
  catch(e){ S.code=makeCode(kind,Object.assign({},payload,{photo:''}),id,editOf); return 'code'; }
}
function showCode(){ const a=$('#codeArea'); if(a) a.innerHTML=codeBox(); }
function readRel(key){
  const v=val('#r_'+key);
  if(v==='__new'){ const dt=readDate('r_'+key); return {id:'',ref:{name:nn(val('#r_'+key+'_n'))?val('#r_'+key+'_n'):'',y:dt.y,m:dt.m,d:dt.d}}; }
  return {id:v,ref:{name:'',y:0,m:0,d:0}};
}
async function onPersonSubmit(){
  const g=(document.querySelector('input[name=f_g]:checked')||{}).value;
  const first=val('#f_first'), last=val('#f_last');
  if(!first||!last){ toast('نام و نام خانوادگی را بنویسید'); return; }
  if(!g){ toast('جنسیت را انتخاب کنید'); return; }
  const dead=$('#f_dead').checked, b=readDate('b'), d=dead?readDate('d'):{y:0,m:0,d:0};
  const fa_=readRel('father'), mo=readRel('mother'), sp=readRel('spouse');
  const payload={first,last,gender:g,bY:b.y,bM:b.m,bD:b.d,dead,dY:d.y,dM:d.m,dD:d.d,
    fatherId:fa_.id,fatherRef:fa_.ref,motherId:mo.id,motherRef:mo.ref,spouseId:sp.id,spouseRef:sp.ref,
    kidNames:val('#f_kids'),place:val('#f_place'),job:val('#f_job'),note:val('#f_note')};
  if(S.photoDirty) payload.photo=S.photo;
  if(!S.editId&&!S.dup){
    const dup=Object.values(S.people).find(p=>p.first===first&&p.last===last&&(p.bY||0)===b.y);
    if(dup){ S.dup=true; $('#dupMsg').innerHTML='<div class="note warn">فردی با همین نام و سال تولد قبلاً ثبت شده است. اگر مطمئنید فرد دیگری است دوباره دکمه را بزنید.</div>'; return; }
  }
  S.dup=false;
  const btn=$('#pform button[type=submit]'); btn.disabled=true;
  try{
    if(S.isAdmin){
      const id=S.editId||newId('p'), ref=S.db.doc('people/'+id);
      if(S.editId) await ref.update(payload); else await ref.set(Object.assign({createdBy:fullName(),createdAt:Date.now()},payload));
      toast(S.editId?'تغییرات ذخیره شد':'در شجره‌نامه ثبت شد');
    } else {
      const r=await deliver('person',payload,newId('p'),S.editId||'');
      toast(r==='sent'?'ارسال شد. بعد از تأیید مدیر در شجره‌نامه دیده می‌شود':'متن ارسال را کپی کنید و برای مدیر بفرستید');
    }
    S.editId=null; S.prefill=null; resetPhoto('');
    const wasCode=!!S.code; $('#formArea').innerHTML=personForm(); if(wasCode) showCode(); else $('#codeArea').innerHTML='';
    const ms=$('#mySubs'); if(ms) ms.innerHTML=mySubsHTML();
  }catch(e){ toast('ثبت نشد. دوباره تلاش کنید'); const bb=$('#pform button[type=submit]'); if(bb) bb.disabled=false; }
}
async function onMemorySubmit(){
  const pid=val('#m_person'), text=val('#m_text'), kind=(document.querySelector('input[name=m_kind]:checked')||{}).value||'memory';
  if(!pid){ toast('فرد مورد نظر را انتخاب کنید'); return; }
  if(!text){ toast('متن را بنویسید'); return; }
  const payload={personId:pid,text,kind,author:fullName()};
  const btn=$('#mform button[type=submit]'); btn.disabled=true;
  try{
    if(S.isAdmin){ await S.db.doc('memories/'+newId('m')).set(Object.assign({at:Date.now()},payload)); toast('ثبت شد'); }
    else{ const r=await deliver('memory',payload,newId('m'),''); toast(r==='sent'?'ارسال شد. بعد از تأیید مدیر نمایش داده می‌شود':'متن ارسال را کپی کنید و برای مدیر بفرستید'); }
    S.memFor=''; const wasCode=!!S.code; $('#formArea').innerHTML=memoryForm(); if(wasCode) showCode(); else $('#codeArea').innerHTML='';
    const ms=$('#mySubs'); if(ms) ms.innerHTML=mySubsHTML();
  }catch(e){ toast('ثبت نشد. دوباره تلاش کنید'); const b2=$('#mform button[type=submit]'); if(b2) b2.disabled=false; }
}

function findPending(k){ const [uid,id]=k.split('|'); return pendingList().find(x=>x.uid===uid&&x.id===id); }
async function markSub(it,status){
  if(it.uid==='__import'){ S.imported=S.imported.filter(x=>x.id!==it.id); return; }
  const patch={status}; if(it.kind==='person'&&it.payload&&it.payload.photo) patch.payload={photo:''};
  await S.db.doc('subs/'+it.uid+'_'+it.id).update(patch);
}
async function approveOne(it){
  if(it.kind==='person'){
    const tid=it.editOf||it.id, ref=S.db.doc('people/'+tid);
    if(it.editOf) await ref.update(it.payload); else await ref.set(Object.assign({createdBy:it.by||'',createdAt:it.at},it.payload));
  } else {
    await S.db.doc('memories/'+it.id).set(Object.assign({kind:'memory'},it.payload,{author:it.payload.author||it.by||'',at:it.at}));
  }
  await markSub(it,'approved');
}
async function doImport(){
  const lines=($('#impTxt').value||'').split(/\s+/).filter(l=>l.startsWith('SHJ1:')); let n=0;
  lines.forEach(l=>{ try{ const o=JSON.parse(decodeURIComponent(escape(atob(l.slice(5)))));
    if(!o||!o.p||!o.id||(o.k!=='person'&&o.k!=='memory')) return;
    if(S.imported.some(x=>x.id===o.id)||pendingList().some(x=>x.id===o.id)) return;
    S.imported.push({id:o.id,kind:o.k,payload:o.p,by:o.by,at:o.at||Date.now(),status:'pending',editOf:o.e||''}); n++; }catch(e){} });
  toast(n?fa(n)+' مورد به فهرست تأیید اضافه شد':'متن معتبری پیدا نشد'); $('#impTxt').value=''; renderNav(); renderView();
}

  if(a==='tab') gotoTab(el.dataset.tab);

  else if(a==='close') closeModal();
  else if(a==='logout'){ lsSet('shj_me',''); S.me=null; S.loginErr=''; render(); }
  else if(a==='toggleadmin'){ S.adminLogin=!S.adminLogin; S.loginErr=''; render(); }
  else if(a==='mode'){ S.mode=el.dataset.m; lsSet('shj_mode2',S.mode); renderView(); }
  else if(a==='zoom'){ S.zoom=Math.min(1.6,Math.max(.5,S.zoom+(+el.dataset.d))); const z=$('#zoomer'); if(z) z.style.zoom=S.zoom; }
  else if(a==='artzoom'){ S.artZoom=Math.min(4,Math.max(.5,S.artZoom+(+el.dataset.d))); const cv=S.artCanvas, box=$('#artBox'); if(cv&&box&&cv.parentElement===box){ cv.style.width=Math.round(Math.max(300,box.clientWidth)*S.artZoom)+'px'; } }
  else if(a==='savepng') saveArt('png');
  else if(a==='savepdf') saveArt('pdf');
  else if(a==='addnew'){ S.editId=null; S.prefill=null; resetPhoto(''); S.addTab='person'; gotoTab('add'); }
  else if(a==='addme'){ S.editId=null; S.prefill={first:S.me.first,last:S.me.last}; resetPhoto(''); S.addTab='person'; gotoTab('add'); }
  else if(a==='fillvirt'){ const p=EP()[el.dataset.id]; S.editId=null; S.prefill={first:p.first,last:p.last,gender:p.gender,bY:p.bY,bM:p.bM,bD:p.bD}; resetPhoto(''); S.addTab='person'; gotoTab('add'); }
  else if(a==='addtab'){ S.addTab=el.dataset.t; S.editId=null; S.prefill=null; S.dup=false; resetPhoto(''); renderView(); }
  else if(a==='addmem'){ S.memFor=el.dataset.id; S.addTab='memory'; gotoTab('add'); }
  else if(a==='editp'){ S.editId=el.dataset.id; S.prefill=null; resetPhoto((S.people[el.dataset.id]||{}).photo||''); S.addTab='person'; gotoTab('add'); }
  else if(a==='canceledit'){ S.editId=null; resetPhoto(''); renderView(); }
  else if(a==='rmphoto'){ S.photo=''; S.photoDirty=true; S.photoMsg='عکس حذف می‌شود.'; $('#formArea').innerHTML=personForm(); }
  else if(a==='delp'){ const id=el.dataset.id; if(S.confirm==='p'+id){ await S.db.doc('people/'+id).delete(); closeModal(); toast('حذف شد'); } else { S.confirm='p'+id; $('#sheet').innerHTML=personSheet(id); } }
  else if(a==='delmem'){ const id=el.dataset.id; if(S.confirm==='m'+id){ await S.db.doc('memories/'+id).delete(); S.confirm=null; toast('حذف شد'); } else { S.confirm='m'+id; $('#sheet').innerHTML=personSheet(S.modal); } }
  else if(a==='approve'){ const it=findPending(el.dataset.k); if(it){ el.disabled=true; await approveOne(it); toast('تأیید شد'); changed(); } }
  else if(a==='reject'){ const it=findPending(el.dataset.k); if(it){ el.disabled=true; await markSub(it,'rejected'); toast('رد شد'); changed(); } }
  else if(a==='approveall'){ el.disabled=true; const l=pendingList().slice().sort((x,y)=>(x.kind==='person'?0:1)-(y.kind==='person'?0:1)||x.at-y.at); for(const it of l){ await approveOne(it); } toast('همه تأیید شدند'); changed(); }
  else if(a==='import') doImport();
  else if(a==='backup'){
    try{ await saveBlob('shajare-allahrezaei.json',new Blob([JSON.stringify({people:S.people,memories:S.memories},null,2)],{type:'application/json'})); toast('فایل ذخیره شد'); }catch(e){ toast('ذخیره فایل انجام نشد'); }
  }
  else if(a==='copycode'){ const t=$('#codeTxt'); try{ await navigator.clipboard.writeText(S.code); toast('کپی شد'); }catch(e){ t.focus(); t.select(); toast('متن را انتخاب کردم، کپی کنید'); } }
  else if(a==='closecode'){ S.code=null; showCode(); }
  }catch(e){ toast('انجام نشد. دوباره تلاش کنید'); changed(); }
});

document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&S.modal) closeModal(); });
window.addEventListener('resize',()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ if(S.tab==='tree'&&S.mode==='art'&&S.artCanvas){ const box=$('#artBox'),cv=S.artCanvas; if(box&&cv.parentElement===box) cv.style.width=Math.round(Math.max(300,box.clientWidth)*S.artZoom)+'px'; } },200); });

/* ================= Supabase layer ================= */
const CFG=Object.assign({url:'',key:'',familyEmail:'',adminEmail:''},window.SHJ_CONFIG||{});
const SB={tok:null,refresh:null,email:''};
const sbReady=()=>!!(CFG.url&&CFG.key&&CFG.familyEmail&&CFG.adminEmail)&&!/PASTE/i.test(CFG.url+CFG.key+CFG.adminEmail);
function sbSave(){ lsSet('shj_sess',JSON.stringify({r:SB.refresh,e:SB.email})); }
async function sbAuth(body,grant){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw {code:r.status,message:j.error_description||j.msg||j.message||'خطا'};
  SB.tok=j.access_token; SB.refresh=j.refresh_token; SB.email=(j.user&&j.user.email)||SB.email; sbSave(); return j;
}
let sbRefreshing=null;
const sbRefresh=()=>sbRefreshing||(sbRefreshing=sbAuth({refresh_token:SB.refresh},'refresh_token').finally(()=>{ sbRefreshing=null; }));
async function sbFetch(path,opt){
  opt=opt||{};
  const go=()=>fetch(CFG.url+path,{method:opt.method||'GET',headers:Object.assign({apikey:CFG.key,Authorization:'Bearer '+(SB.tok||CFG.key),'Content-Type':'application/json'},opt.headers||{}),body:opt.body});
  let r=await go();
  if(r.status===401&&SB.refresh&&!opt.retried){ try{ await sbRefresh(); }catch(e){} opt.retried=1; r=await go(); }
  if(!r.ok) throw {code:r.status,message:await r.text().catch(()=>'')};
  const t=await r.text(); return t?JSON.parse(t):null;
}
function dmerge(a,b){ const o=Object.assign({},a); for(const k in b){ const v=b[k]; o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?dmerge(o[k],v):v; } return o; }
function mkDb(){
  const enc=encodeURIComponent, parentOf=p=>p.split('/').slice(0,-1).join('/');
  const pollers=new Set(); let timer=null;
  const poke=()=>setTimeout(()=>pollers.forEach(f=>f()),60);
  const ensure=()=>{ if(timer) return; timer=setInterval(()=>{ if(!document.hidden) pollers.forEach(f=>f()); },20000); };
  const snapDoc=(path,data)=>({id:path.split('/').pop(),exists:data!=null,data:()=>data});
  const doc=path=>({
    id:path.split('/').pop(), path,
    async get(){ const r=await sbFetch('/rest/v1/shj_docs?select=data&path=eq.'+enc(path)); return snapDoc(path,r&&r[0]?r[0].data:null); },
    async set(d){
      const row={path,parent:parentOf(path),data:d,updated_at:new Date().toISOString()};
      if(S.isAdmin) await sbFetch('/rest/v1/shj_docs?on_conflict=path',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});
      else await sbFetch('/rest/v1/shj_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
      poke();
    },
    async update(d){ const cur=await this.get(); if(!cur.exists) throw {code:'invalid_argument'}; await this.set(dmerge(cur.data(),d)); },
    async delete(){ await sbFetch('/rest/v1/shj_docs?path=eq.'+enc(path),{method:'DELETE'}); poke(); }
  });
  const collection=parent=>({
    onSnapshot(next,err){
      let sig=''; 
      const run=async()=>{
        try{
          const meta=await sbFetch('/rest/v1/shj_docs?select=path,updated_at&parent=eq.'+enc(parent)+'&order=path.asc&limit=5000');
          const sg=JSON.stringify(meta); if(sg===sig) return;
          const rows=await sbFetch('/rest/v1/shj_docs?select=path,data&parent=eq.'+enc(parent)+'&order=path.asc&limit=5000');
          sig=sg; next({docs:(rows||[]).map(x=>snapDoc(x.path,x.data)),size:(rows||[]).length});
        }catch(e){ if(err) err({code:(e&&e.code)||'unavailable'}); }
      };
      pollers.add(run); ensure(); run(); return ()=>pollers.delete(run);
    }
  });
  return {doc,collection};
}
function startData(){
  const db=mkDb(); S.db=db;
  const err=e=>{ S.dbError=(e&&e.code)||'خطا'; render(); };
  db.collection('people').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.people=o; S.dbError=null; changed(); },err);
  db.collection('memories').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.memories=o; changed(); },err);
  setInterval(()=>{ if(SB.refresh) sbRefresh().catch(()=>{}); },40*60*1000);
  startSubs();
}
function startSubs(){
  if(!S.isAdmin||S.subsOn||!S.db) return; S.subsOn=true;
  S.db.collection('subs').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>{ const x=d.data(); const u=x.uid||'?'; (o[u]=o[u]||{items:{}}).items[x.id]=x; }); S.subs=o; changed(); },()=>{});
}
async function doLogin(){
  const f=$('#l_first').value.trim(), l=$('#l_last').value.trim(); if(!f||!l) return;
  const btn=document.querySelector('#loginForm button[type=submit]'); if(btn) btn.disabled=true;
  try{
    if(S.adminLogin){
      await sbAuth({email:$('#l_email').value.trim(),password:$('#l_pass').value},'password');
      if(SB.email.toLowerCase()!==CFG.adminEmail.toLowerCase()){ SB.tok=null; SB.refresh=null; lsSet('shj_sess',''); S.authed=false; throw {message:'این حساب مدیر نیست'}; }
      S.isAdmin=true;
    } else if(!S.authed){
      await sbAuth({email:CFG.familyEmail,password:$('#l_code').value},'password'); S.isAdmin=false;
    }
    S.authed=true; S.me={first:f,last:l}; lsSet('shj_me',JSON.stringify(S.me)); S.loginErr=''; S.adminLogin=false;
    if(!S.db) startData(); else startSubs();
    render();
  }catch(e){ S.loginErr=(e&&e.code===400)?'رمز یا ایمیل درست نیست':((e&&e.message&&e.code!==undefined&&typeof e.code==='number')?'ورود انجام نشد. اینترنت را بررسی کنید':(e&&e.message)||'ورود انجام نشد'); render(); }
}

/* ================= boot ================= */
async function boot(){
  render();
  if(!sbReady()){ S.gate=true; S.ready=true; render(); return; }
  try{ const m=JSON.parse(lsGet('shj_me')||'null'); if(m&&m.first&&m.last) S.me=m; }catch(e){}
  S.uid=lsGet('shj_uid')||(()=>{ const a=new Uint8Array(8); crypto.getRandomValues(a); const u='u'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(''); lsSet('shj_uid',u); return u; })();
  try{ S.mySub=JSON.parse(lsGet('shj_mysub')||'null'); }catch(e){}
  try{ const ss=JSON.parse(lsGet('shj_sess')||'null'); if(ss&&ss.r){ SB.refresh=ss.r; SB.email=ss.e||''; await sbRefresh(); S.authed=true; S.isAdmin=SB.email.toLowerCase()===CFG.adminEmail.toLowerCase(); } }catch(e){ lsSet('shj_sess',''); }
  S.ready=true;
  if(S.authed) startData();
  render();
}
boot();
})();
